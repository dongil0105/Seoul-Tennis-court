# Render 무료 플랜은 15분간 접속이 없으면 서버가 잠듦 → 10분마다 /health 를 찔러 깨어 있게 유지.
# 깨어 있어야 알람 스케줄러(전날·1시간 전 카톡)가 제때 돈다.
name: keep-awake ping

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (UTC 기준, 몇 분 지연될 수 있음 — 상관없음)
  workflow_dispatch: {}       # 수동 실행 버튼(로그인해야 보임)
  push:                       # 이 파일을 고쳐 올리면 한 번 바로 실행(동작 확인용)
    branches: [main]
    paths: [".github/workflows/ping.yml"]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping /health
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" -m 90 https://seoul-tennis-court.onrender.com/health)
          echo "HTTP $code"; cat /tmp/body; echo
          test "$code" = "200"
