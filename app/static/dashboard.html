<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코트 오픈</title>
<meta name="description" content="한남·장충·마루공원·선우공원·서울숲 테니스장의 예약 오픈 일정과 지금 예약할 수 있는 코트">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코트 오픈">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 토큰 ─────────────────────────────────────────────── */
:root{
  color-scheme:light dark;
  --bg:#FFFFFF; --band:#F3F4F6; --line:#ECEEF0; --line-2:#D9DDE1; --press:#F3F4F6;
  --ink:#15181B; --ink-2:#4A5158; --ink-3:#646C74; --ink-4:#868D94;
  --brand:#0C7A4A; --brand-weak:#EEF8F2;
  --lime:#D8F25C; --on-lime:#1A2A0B;
  --alert:#C9371F; --on-alert:#FFFFFF;
  --shadow:0 -6px 32px rgba(15,23,30,.14);
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111315; --band:#08090A; --line:#22262A; --line-2:#33383D; --press:#1A1D20;
    --ink:#F2F4F5; --ink-2:#BBC1C7; --ink-3:#8E959C; --ink-4:#6E757C;
    --brand:#56CF98; --brand-weak:#11221A;
    --alert:#FF8D78; --on-alert:#2B0B05;
    --shadow:0 -6px 32px rgba(0,0,0,.55);
  }
}

/* ── 기본 ─────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;min-height:100dvh;margin:0 auto;background:var(--bg)}
@media (min-width:560px){
  body{background:var(--band)}
  .app{box-shadow:0 0 0 1px var(--line)}
}

/* ── 상단 바 ──────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0 20px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-height:44px;font-size:18px;font-weight:700;letter-spacing:-.03em}
.brand svg{width:28px;height:28px}
.bar-actions{display:flex;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:12px;
  font-size:13px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sync svg{width:16px;height:16px}
.sync[aria-busy=true] svg{animation:spin .8s linear infinite}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.on{color:var(--brand)}
.sync:active,.icon-btn:active{background:var(--press)}

/* ── 다음 예약 오픈 ───────────────────────────────────── */
.next{padding:18px 20px 22px}
.next.is-open{background:var(--brand-weak)}
.next:not(.is-open):has(.peek){padding-bottom:2px}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-3)}
.eyebrow.live{color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.next-date{margin-top:14px;font-size:17px;font-weight:600;color:var(--ink-2);letter-spacing:-.02em}
.next-h{margin-top:2px;font-size:inherit;font-weight:inherit;line-height:inherit}
.next-time{display:block;margin-left:-2px;font-size:56px;line-height:1.05;font-weight:700;letter-spacing:-.045em;font-variant-numeric:normal}
.next-venue{display:block;margin-top:10px;font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.035em}
.next-meta{margin-top:3px;font-size:14px;color:var(--ink-3)}
.next-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.remain{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:10px;
  background:var(--lime);color:var(--on-lime);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.remain.soon{background:var(--alert);color:var(--on-alert)}
.ghost{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 2px;font-size:14px;font-weight:600;color:var(--ink-2)}
.ghost svg{width:18px;height:18px}
.ghost.on{color:var(--brand)}
.peek{margin-top:16px;border-top:1px solid var(--line)}
.peek>summary{display:flex;align-items:center;justify-content:space-between;min-height:50px;
  font-size:14px;font-weight:600;color:var(--ink-2)}
.peek .picker{padding:2px 0 6px}
.chev{width:18px;height:18px;color:var(--ink-4);transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}

.opened+.opened{margin-top:28px;padding-top:24px;border-top:1px solid color-mix(in srgb,var(--brand) 18%,transparent)}
.venue-title{margin-top:10px;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.035em}
.opened .picker{margin-top:18px}
.hint{display:flex;gap:7px;margin-top:16px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.row-note{padding:0 0 16px;font-size:13px;color:var(--ink-3)}
.hint svg{width:16px;height:16px;margin-top:2px}

.none-title{margin-top:12px;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-.03em}
.none-sub{margin-top:6px;font-size:14px;color:var(--ink-3)}
.none-cta{margin-top:18px}
.ghost.outline{padding:0 16px;border:1px solid var(--line-2);border-radius:12px;color:var(--ink)}
.ghost.outline.on{border-color:color-mix(in srgb,var(--brand) 40%,transparent);color:var(--brand)}
.ghost.outline:active{background:var(--press)}

/* ── 섹션 ─────────────────────────────────────────────── */
.band{height:8px;background:var(--band)}
.sec{padding:24px 20px 6px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.03em}
.count{font-size:14px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec-sub{margin-top:4px;font-size:13px;color:var(--ink-3)}
.sub-label{margin-top:22px;font-size:13px;font-weight:600;color:var(--ink-3)}

.rows{margin-top:6px}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>summary{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:70px;padding:12px 0}
.when b{display:block;font-size:17px;line-height:1.25;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.when span{display:block;font-size:12.5px;color:var(--ink-3)}
.what strong{display:block;font-size:16px;line-height:1.35;font-weight:600;letter-spacing:-.02em}
.what span{display:block;font-size:13px;line-height:1.45;color:var(--ink-3)}
.tail{display:flex;align-items:center;gap:6px}
.dday{padding:4px 8px;border-radius:8px;background:var(--band);color:var(--ink-2);
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dday.near{background:var(--brand-weak);color:var(--brand)}
.row .picker{padding:2px 0 18px}
.pend{padding:13px 0;border-bottom:1px solid var(--line)}
.pend:last-child{border-bottom:0}

/* ── 지금 예약 가능 ───────────────────────────────────── */
.venue{padding:18px 0 20px;border-bottom:1px solid var(--line)}
.venue:last-child{border-bottom:0}
.venue h3{display:flex;align-items:baseline;gap:6px;font-size:17px;line-height:1.35;font-weight:700;letter-spacing:-.025em}
.venue h3 span{font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:-.01em}
.venue-meta{margin-top:2px;font-size:13px;color:var(--ink-3)}
.venue .picker{margin-top:12px}

.group+.group{margin-top:16px}
.group-label{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.group-label span{font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.courts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.courts[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.courts[data-cols="1"]{grid-template-columns:minmax(0,1fr)}
.court{position:relative;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:66px;
  padding:10px 12px;border:1px solid var(--line-2);border-radius:14px;background:var(--bg);
  transition:transform .12s,background .12s,border-color .12s}
.court b{padding-right:16px;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.03em}
.court b small{margin-left:1px;font-size:13px;font-weight:600;color:var(--ink-2)}
.court b.word{font-size:16px}
.court span{font-size:12.5px;line-height:1.4;color:var(--ink-3);letter-spacing:-.02em}
.court em{font-style:normal;font-weight:600;color:var(--brand)}
.court .out{position:absolute;top:10px;right:9px;width:13px;height:13px;color:var(--ink-4)}
.court:active{background:var(--press);transform:scale(.98)}
@media (hover:hover){.court:hover{border-color:var(--ink-3)}}
.court.off{opacity:.5}
.courts[data-cols="1"] .court{min-height:60px}

.empty{margin-top:14px;padding:22px 0 26px}
.empty strong{display:block;font-size:16px;font-weight:600}
.empty p{margin-top:4px;font-size:14px;color:var(--ink-3)}

/* ── 설정 줄 · 꼬리말 ─────────────────────────────────── */
.cells{padding:4px 20px}
.cell{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;text-align:left;border-bottom:1px solid var(--line)}
.cell:last-child{border-bottom:0}
.cell .lead{width:22px;height:22px;color:var(--ink-2)}
.cell .t{flex:1;font-size:16px;font-weight:500;letter-spacing:-.02em}
.cell .v{font-size:14px;color:var(--ink-3)}
.cell .v.on{font-weight:600;color:var(--brand)}
.cell .chev-r{width:18px;height:18px;color:var(--ink-4)}
.cell:active{background:var(--press)}
.foot{padding:18px 20px calc(28px + env(safe-area-inset-bottom));font-size:12.5px;line-height:1.6;color:var(--ink-3)}

/* ── 알림 시트 ────────────────────────────────────────── */
dialog{width:100%;max-width:520px;max-height:min(90dvh,760px);margin:auto auto 0;padding:0;border:0;
  border-radius:22px 22px 0 0;background:var(--bg);color:var(--ink);box-shadow:var(--shadow);overflow:auto}
dialog::backdrop{background:rgba(8,10,12,.52)}
dialog[open]{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:560px){dialog{max-width:440px;margin:auto;border-radius:22px}}
.sheet{padding:6px 20px calc(18px + env(safe-area-inset-bottom))}
.grab{width:36px;height:4px;margin:6px auto 2px;border-radius:2px;background:var(--line-2)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-right:-10px}
.sheet-head h2{font-size:20px;font-weight:700;letter-spacing:-.03em}
.sheet-desc{font-size:14px;color:var(--ink-3)}
.sheet-label{margin:22px 0 2px;font-size:13px;font-weight:600;color:var(--ink-3)}
.pick{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;
  border-bottom:1px solid var(--line);font-size:16px;letter-spacing:-.02em;cursor:pointer}
.pick:last-of-type{border-bottom:0}
.pick input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pick svg{width:24px;height:24px}
.pick svg circle{fill:none;stroke:var(--line-2);stroke-width:1.6}
.pick svg path{stroke:transparent;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pick input:checked~svg circle{fill:var(--brand);stroke:var(--brand)}
.pick input:checked~svg path{stroke:var(--bg)}
.pick input:focus-visible~span{outline:2px solid var(--brand);outline-offset:4px;border-radius:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;
  border-bottom:1px solid var(--line);font-size:16px;letter-spacing:-.02em;cursor:pointer}
.switch:last-of-type{border-bottom:0}
.switch input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:50px;height:30px;margin:0;
  border-radius:15px;background:var(--line-2);transition:background .2s;cursor:pointer}
.switch input::before{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
.switch input:checked{background:var(--brand)}
.switch input:checked::before{transform:translateX(20px)}
.install{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--band);font-size:14px}
.install strong{display:block;font-weight:600}
.install ol{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
.install li{padding:2px 0}
.primary{width:100%;height:54px;margin-top:22px;border-radius:14px;background:var(--ink);color:var(--bg);
  font-size:16px;font-weight:700;letter-spacing:-.02em;transition:opacity .15s,transform .12s}
.primary:active{transform:scale(.99);opacity:.86}
.primary:disabled{opacity:.5}
.push-status{min-height:20px;margin-top:12px;font-size:13px;text-align:center;color:var(--ink-3)}
.sheet-foot{display:flex;justify-content:center;gap:24px;margin-top:4px}
.text-btn{min-height:44px;padding:0 4px;font-size:14px;font-weight:500;color:var(--ink-2);
  text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}

/* ── 토스트 · 뼈대 ────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:60;
  max-width:min(92vw,440px);padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);
  font-size:14px;font-weight:500;text-align:center;opacity:0;transform:translate(-50%,8px);pointer-events:none;
  transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--band) 25%,var(--line) 37%,var(--band) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite}
.slow{margin-top:16px;font-size:13px;color:var(--ink-3)}
.retry{display:inline-flex;align-items:center;height:44px;margin-top:14px;padding:0 16px;border-radius:12px;
  border:1px solid var(--line-2);font-size:14px;font-weight:600}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:359px){
  .next,.sec{padding-left:16px;padding-right:16px}
  .cells{padding-left:16px;padding-right:16px}
  .foot{padding-left:16px;padding-right:16px}
  .bar{padding-left:16px}
  .next-time{font-size:52px}
  .court{padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar" id="bar">
    <a class="brand" href="/" aria-label="코트 오픈 홈">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0E2A20"/><circle cx="16" cy="16" r="8.5" fill="#D8F25C"/><path d="M9.6 10.4c2.7 1.6 4.1 3.5 4.1 5.6s-1.4 4-4.1 5.6M22.4 10.4c-2.7 1.6-4.1 3.5-4.1 5.6s1.4 4 4.1 5.6" fill="none" stroke="#0E2A20" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>코트 오픈</span>
    </a>
    <div class="bar-actions">
      <button class="sync" id="refresh" aria-label="공식 데이터 새로 고침">
        <span id="stamp">불러오는 중</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="bell" data-act="sheet" aria-label="오픈 알림 설정"></button>
    </div>
  </header>

  <main>
    <section class="next" id="next" aria-label="다음 예약 오픈">
      <div class="sk" style="width:96px;height:16px"></div>
      <div class="sk" style="width:150px;height:20px;margin-top:16px"></div>
      <div class="sk" style="width:190px;height:58px;margin-top:8px"></div>
      <div class="sk" style="width:170px;height:24px;margin-top:14px"></div>
      <div class="sk" style="width:210px;height:16px;margin-top:8px"></div>
      <p class="slow" id="slow" hidden>불러오는 중이에요. 처음 열 때는 30초쯤 걸릴 수 있어요.</p>
    </section>

    <div class="band" id="band-next" hidden></div>
    <section class="sec" id="schedule" hidden></section>

    <div class="band"></div>
    <section class="sec" id="available" aria-label="지금 접수 중인 코트">
      <div class="sk" style="width:130px;height:24px"></div>
      <div class="sk" style="height:66px;margin-top:18px;border-radius:14px"></div>
      <div class="sk" style="height:66px;margin-top:10px;border-radius:14px"></div>
    </section>

    <div class="band"></div>
    <div class="cells">
      <button class="cell" data-act="sheet">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 8H4c0-1.5 2-3 2-8Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="t">오픈 알림</span><span class="v" id="push-value">꺼짐</span>
        <svg class="chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="cell" id="share">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        <span class="t">친구에게 공유</span>
        <svg class="chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
    <footer class="foot">서울시 공공서비스예약의 공식 데이터를 보여드려요. 날짜와 시간별로 남은 자리는 예약 화면에서 확인해 주세요.</footer>
  </main>
</div>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">

      </button>
    </div>
    <p class="sheet-desc">예약이 열리기 전날과 1시간 전에 이 기기로 알려드려요.</p>

      <strong>아이폰은 홈 화면에 추가한 뒤에 켤 수 있어요</strong>
      <ol><li>Safari 아래쪽 공유 버튼을 눌러요</li><li>‘홈 화면에 추가’를 골라요</li><li>홈 화면의 코트 오픈을 열고 알림을 켜요</li></ol>
    </div>

</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px 20px">이 앱은 자바스크립트를 켜야 볼 수 있어요.</p></noscript>

<script>
'use strict';
/* 코트 오픈 — 화면 스크립트.
   서버(/board, /refresh, /push/*)만 호출한다. 서울시 예약 사이트 주소는 사람이 누르는 링크로만 쓴다. */
const $ = (id) => document.getElementById(id);
const MOCK = new URLSearchParams(location.search).get('mock');   // opened | late | next | soon | none | empty
const AREAS = ['한남', '장충', '마루공원', '선우공원', '서울숲'];
const NAMES = {'한남': '한남테니스장', '장충': '장충테니스장', '마루공원': '마루공원', '선우공원': '선우공원', '서울숲': '서울숲 테니스장'};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// 예약 링크는 서울시 사이트(https)일 때만 건다.
const safeURL = (s) => { try { const u = new URL(s); return u.protocol === 'https:' && /(^|\.)seoul\.go\.kr$/.test(u.hostname) ? u.href : ''; } catch { return ''; } };

const ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  out: '<svg class="out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 8H4c0-1.5 2-3 2-8Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  bellOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 8H4c0-1.5 2-3 2-8Z"/><path d="M10 20a2 2 0 0 0 4 0" fill="none"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.3 3 3 6-6.4"/></svg>',
};

/* ── 시간: 서버 문자열은 모두 한국시간 'YYYY-MM-DD HH:MM[:SS]' ───────── */
const WD = ['일', '월', '화', '수', '목', '금', '토'];
function kstMs(s) {
  s = String(s || '');
  if (s.length < 16) return NaN;
  return Date.parse(`${s.slice(0, 10)}T${s.slice(11, 16)}:${s.length >= 19 ? s.slice(17, 19) : '00'}+09:00`);
}
const todayKST = () => new Intl.DateTimeFormat('sv-SE', {timeZone: 'Asia/Seoul'}).format(new Date());
const ymd = (s) => ({y: +s.slice(0, 4), m: +s.slice(5, 7), d: +s.slice(8, 10)});
const utcDay = (s) => { const {y, m, d} = ymd(s); return Date.UTC(y, m - 1, d); };
const weekday = (s) => WD[new Date(utcDay(s)).getUTCDay()];
const dayDiff = (s) => Math.round((utcDay(s) - utcDay(todayKST())) / 864e5);
const longDate = (s) => { const {m, d} = ymd(s); return `${m}월 ${d}일 ${weekday(s)}요일`; };
const shortDate = (s) => { const {m, d} = ymd(s); return `${m}.${d}`; };
const hm = (s) => String(s).slice(11, 16);
function remainText(ms) {
  if (ms <= 0) return '지금 열려요';
  const min = Math.ceil(ms / 60000);
  if (min < 60) return `${min}분 남음`;
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return m ? `${h}시간 ${m}분 남음` : `${h}시간 남음`;
  const d = Math.floor(h / 24), hh = h % 24;
  return d < 3 && hh ? `${d}일 ${hh}시간 남음` : `${d}일 남음`;
}
const ddayText = (n) => (n <= 0 ? '오늘' : n === 1 ? '내일' : `D-${n}`);

/* ── 코트 버튼 ────────────────────────────────────────── */
const isLit = (c) => /조명/.test(c.court || '');
const courtNo = (c) => { const m = /^(\d+)/.exec(c.court || ''); return m ? +m[1] : 999; };
const shortSlot = (s) => (!s || s === '매일' ? '' : String(s).replace(/주말·공휴일/g, '주말').replace(/\s+·\s+/g, ', '));
function hoursText(t) {
  const m = /^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/.exec(String(t || '').trim());
  if (!m) return '';
  return m[2] === '00' && m[4] === '00' ? `${m[1]}–${m[3]}시` : `${m[1]}:${m[2]}–${m[3]}:${m[4]}`;
}
function slotKind(c) {
  const s = c.slot || '';
  if (/야간|주말|공휴일/.test(s) || /(^|[\s·])[월화수목금토일](?=$|[\s·])/.test(s)) return 'night';
  if (/평일|주간|새벽/.test(s)) return 'day';
  return 'any';
}
function kindLabel(k, list) {
  const has = (re) => list.some((c) => re.test(c.slot || ''));
  if (k === 'day') return has(/새벽/) ? '평일 새벽 · 주간' : has(/주간/) ? '평일 주간' : '평일';
  if (k === 'night') {
    const wk = has(/주말|공휴일|(^|[\s·])[토일](?=$|[\s·])/);
    return [has(/야간/) ? '야간' : '', wk ? (has(/공휴일/) ? '주말 · 공휴일' : '주말') : ''].filter(Boolean).join(' · ') || '야간 · 주말';
  }
  return '상시';
}
const isNumbered = (c) => /^(\d+|[A-Za-z])/.test(String(c.court || ''));
const physKey = (c) => String(c.court || '').replace(/\s*조명$/, '').trim();
/* 실제 코트 수 — 같은 코트의 시간대별 예약은 한 번만 센다. 번호가 없는 예약이 섞이면 세지 않는다. */
function courtCount(courts) {
  const list = courts || [];
  return list.length && list.every(isNumbered) ? new Set(list.map(physKey)).size : 0;
}
/* 모든 코트의 운영 시간이 같으면 그 시간 — 버튼에서는 빼고 위 설명에 한 번만 쓴다. */
function commonHours(courts) {
  const list = courts || [];
  if (!list.length || !list.every(isNumbered) || new Set(list.map((c) => c.time)).size > 1) return '';
  return hoursText(list[0].time);
}

function courtHTML(c, ctx) {
  const m = /^(\d+|[A-Za-z])\s*(번|면)?/.exec(String(c.court || ''));
  const slot = shortSlot(c.slot), hours = hoursText(c.time);
  const line1 = [];
  let main, unit = '';
  if (m) { main = m[1]; unit = m[2] || (/\d/.test(m[1]) ? '번' : '코트'); if (slot) line1.push(esc(slot)); }
  else main = slot || '예약';
  if (isLit(c)) line1.push('조명');
  if (!c.is_paid) line1.push('<em>무료</em>'); else if (ctx.mixedFee) line1.push('유료');
  if (ctx.mixedConfirm && c.confirmed) line1.push('<em>접수 중</em>');
  const line2 = ctx.hideHours ? '' : hours;
  const inner = `<b${m ? '' : ' class="word"'}>${esc(main)}${unit ? `<small>${unit}</small>` : ''}</b>`
    + (line1.length ? `<span>${line1.join(' · ')}</span>` : '')
    + (line2 ? `<span class="num">${esc(line2)}</span>` : '') + ICON.out;
  const u = safeURL(c.reserve_url);
  const label = [c.court, c.slot, hours, c.is_paid ? '' : '무료', '예약 화면 열기'].filter(Boolean).join(', ');
  return u
    ? `<a class="court" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(label)}">${inner}</a>`
    : `<span class="court off" aria-disabled="true">${inner}</span>`;
}
function pickerHTML(courts, keepHours) {
  const list = [...(courts || [])].sort((a, b) => (isLit(a) - isLit(b)) || (courtNo(a) - courtNo(b))
    || String(a.court).localeCompare(String(b.court), 'ko') || String(a.slot).localeCompare(String(b.slot), 'ko'));
  const ctx = {
    mixedFee: list.some((c) => c.is_paid) && list.some((c) => !c.is_paid),
    mixedConfirm: list.some((c) => c.confirmed) && list.some((c) => !c.confirmed),
    hideHours: !keepHours && Boolean(commonHours(list)),
  };
  const groups = ['day', 'night', 'any'].map((k) => [k, list.filter((c) => slotKind(c) === k)]).filter(([, l]) => l.length);
  const grid = (l) => `<div class="courts" data-cols="${l.length === 1 ? 1 : (l.length === 2 || l.length === 4) ? 2 : 3}">${l.map((c) => courtHTML(c, ctx)).join('')}</div>`;
  return `<div class="picker">${groups.map(([k, l]) => `<div class="group">${
    groups.length > 1 ? `<p class="group-label">${kindLabel(k, l)}<span>${l.length}</span></p>` : ''}${grid(l)}</div>`).join('')}</div>`;
}
const dots = (t) => String(t || '').replace(/(\d{1,2})\/(\d{1,2})/g, '$1.$2');
const periodText = (p) => (!p ? '' : /이용분$/.test(p) ? dots(p) : `${dots(p)} 이용분`);

/* ── 그리기 ───────────────────────────────────────────── */
const HOT_MS = 2 * 36e5;   // 예약이 열리고 2시간까지는 맨 위에 코트 버튼을 펼쳐 둔다
let board = null, updatedAt = '', nextOpenMs = null, coolAtMs = null, renderedDay = '';

function alarmButton(area, outline) {
  const on = subscribedTo(area);
  return `<button class="ghost${outline ? ' outline' : ''}${on ? ' on' : ''}" data-act="sheet" data-alarm="${esc(area)}">${on ? ICON.bellOn : ICON.bell}<span>${on ? '알림 켜짐' : '알림 받기'}</span></button>`;
}
function openedHTML(x, i) {
  const allOk = x.courts.length > 0 && x.courts.every((c) => c.confirmed);
  const n = courtCount(x.courts);
  const meta = [periodText(x.period), n ? `코트 ${n}면` : '', commonHours(x.courts)].filter(Boolean).join(' · ');
  const note = allOk ? '날짜별 빈 시간은 예약 화면에서 확인해 주세요.'
    : '서울시 접수 상태가 아직 반영되지 않았어요. 이미 마감된 코트가 있을 수 있으니 예약 화면에서 확인해 주세요.';
  return `<article class="opened">
    <p class="eyebrow live"><i class="dot"></i>오늘 ${esc(hm(x.open_at))}에 예약이 열렸어요</p>
    <${i ? 'h2' : 'h1'} class="venue-title">${esc(x.place || NAMES[x.area] || x.area)}</${i ? 'h2' : 'h1'}>
    ${meta ? `<p class="next-meta">${esc(meta)}</p>` : ''}
    ${pickerHTML(x.courts)}
    <p class="hint">${ICON.info}<span>${note}</span></p>
  </article>`;
}
function nextHTML(x) {
  const diff = dayDiff(x.open_at), ms = kstMs(x.open_at) - Date.now(), n = courtCount(x.courts);
  const rel = diff === 0 ? '오늘 · ' : diff === 1 ? '내일 · ' : '';
  const meta = [periodText(x.period), n ? `코트 ${n}면` : '', commonHours(x.courts)].filter(Boolean).join(' · ');
  return `<p class="eyebrow">다음 예약 오픈</p>
    <p class="next-date">${rel}${longDate(x.open_at)}</p>
    <h1 class="next-h"><span class="next-time">${esc(hm(x.open_at))}</span> <span class="next-venue">${esc(x.place || NAMES[x.area] || x.area)}</span></h1>
    ${meta ? `<p class="next-meta">${esc(meta)}</p>` : ''}
    <div class="next-foot"><span class="remain${ms < 36e5 ? ' soon' : ''}" id="remain">${remainText(ms)}</span>${alarmButton(x.area)}</div>
    <details class="peek"><summary><span>${n ? `코트 ${n}면 보기` : '코트 보기'}</span>${ICON.chev}</summary>${pickerHTML(x.courts)}</details>`;
}
function noneHTML() {
  return `<p class="eyebrow">다음 예약 오픈</p>
    <h1 class="none-title">아직 등록된 오픈 일정이 없어요</h1>
    <p class="none-sub">서울시가 다음 회차를 올리면 날짜와 시각이 여기에 나와요.</p>
    <div class="none-cta">${alarmButton('', true)}</div>`;
}
function rowHTML(x) {
  const diff = dayDiff(x.open_at), n = courtCount(x.courts);
  const sub = [`${hm(x.open_at)} 오픈`, periodText(x.period), n ? `${n}면` : ''].filter(Boolean).join(' · ');
  const chip = x.opened ? '<span class="dday near">열림</span>' : `<span class="dday${diff <= 1 ? ' near' : ''}">${ddayText(diff)}</span>`;
  return `<details class="row"><summary>
      <div class="when"><b>${shortDate(x.open_at)}</b><span>${weekday(x.open_at)}요일</span></div>
      <div class="what"><strong>${esc(x.place || NAMES[x.area] || x.area)}</strong><span>${esc(sub)}</span></div>
      <div class="tail">${chip}${ICON.chev}</div>
    </summary>${pickerHTML(x.courts, true)}${x.opened ? '<p class="row-note">마감됐을 수 있어요. 예약 화면에서 확인해 주세요.</p>' : ''}</details>`;
}
function pendHTML(p) {
  const past = (p.past_opens || []).slice(0, 2).map((s) => `${shortDate(s)} (${weekday(s)}) ${hm(s)}`).join(' · ');
  return `<div class="pend what"><strong>${esc(p.place || NAMES[p.area] || p.area)}</strong><span class="num">지난 오픈 ${esc(past)}</span></div>`;
}
function venueHTML(p) {
  const cs = p.courts || [], full = Number(p.full_count) || 0;
  const meta = [
    p.until_kind === 'use' && p.period ? periodText(p.period) : dots(p.until_label),
    full ? `나머지 ${full}개 마감` : '',
    commonHours(cs),
  ].filter(Boolean).join(' · ');
  return `<article class="venue">
    <h3>${esc(p.place || NAMES[p.area] || p.area)}${p.region ? `<span>${esc(p.region)}</span>` : ''}</h3>
    <p class="venue-meta num">${esc(meta)}</p>
    ${pickerHTML(cs)}
  </article>`;
}

function renderBoard(d) {
  board = d;
  if (d.updated_at) updatedAt = d.updated_at;
  renderedDay = todayKST();
  const now = Date.now();
  const arr = (v) => (Array.isArray(v) ? v.filter(Boolean) : []);
  // 잘못된 항목은 빼고 그린다. 열린 예약은 오늘 것만(서버 기준과 같게).
  const openings = arr(d.openings).filter((x) => Number.isFinite(kstMs(x.open_at)))
    .map((x) => ({...x, courts: arr(x.courts), opened: Boolean(x.opened) || kstMs(x.open_at) <= now}))
    .filter((x) => !x.opened || dayDiff(x.open_at) === 0)
    .sort((a, b) => String(a.open_at).localeCompare(String(b.open_at)));
  const opened = openings.filter((x) => x.opened);
  const hot = opened.filter((x) => now - kstMs(x.open_at) < HOT_MS);      // 방금 열림 → 맨 위에 펼침
  const cold = opened.filter((x) => !hot.includes(x));                    // 열린 지 오래됨 → 일정 줄로
  const upcoming = openings.filter((x) => !x.opened);
  nextOpenMs = upcoming.length ? kstMs(upcoming[0].open_at) : null;
  coolAtMs = hot.length ? Math.min(...hot.map((x) => kstMs(x.open_at) + HOT_MS)) : null;

  const next = $('next');
  next.className = 'next' + (hot.length ? ' is-open' : '');
  next.setAttribute('aria-label', hot.length ? '오늘 열린 예약' : '다음 예약 오픈');
  next.innerHTML = hot.length ? hot.map(openedHTML).join('') : upcoming.length ? nextHTML(upcoming[0]) : noneHTML();

  const rest = [...cold, ...(hot.length ? upcoming : upcoming.slice(1))];
  const busy = new Set(openings.map((x) => x.area));
  const pending = arr(d.places).filter((p) => !busy.has(p.area) && arr(p.past_opens).length);
  const title = hot.length ? '다음 오픈 일정' : cold.length ? '오픈 일정' : '이후 오픈 일정';
  const sch = $('schedule');
  sch.hidden = !rest.length && !pending.length;
  $('band-next').hidden = sch.hidden || hot.length > 0;
  sch.innerHTML = (rest.length
      ? `<div class="sec-head"><h2>${title}</h2></div><div class="rows">${rest.map(rowHTML).join('')}</div>`
        + (pending.length ? '<p class="sub-label">일정 미정</p>' : '')
      : '<div class="sec-head"><h2>일정 미정</h2></div><p class="sec-sub">지난 오픈 날짜와 시각을 참고하세요.</p>')
    + (pending.length ? `<div class="rows">${pending.map(pendHTML).join('')}</div>` : '');

  const avail = arr(d.available).map((p) => ({...p, courts: arr(p.courts)})).filter((p) => p.courts.length);
  $('available').innerHTML = '<div class="sec-head"><h2>지금 접수 중인 코트</h2></div>'
    + (avail.length
      ? `<p class="sec-sub">코트를 누르면 서울시 예약 화면이 열려요. 날짜별 빈 시간은 그 화면에서 확인해 주세요.</p>${avail.map(venueHTML).join('')}`
      : '<div class="empty"><strong>지금 접수 중인 코트가 없어요</strong><p>예약이 열리면 여기에 코트 번호가 나타나요.</p></div>');

  paintStamp();
  paintPush();
  const badge = Math.max(0, Number(d.badge) || 0);
  try { if (navigator.setAppBadge) Promise.resolve(badge ? navigator.setAppBadge(badge) : navigator.clearAppBadge()).catch(() => {}); } catch {}
}
function renderError() {
  $('next').className = 'next';
  $('next').innerHTML = `<p class="eyebrow">연결 문제</p><h1 class="none-title">정보를 불러오지 못했어요</h1>

    {area: '한남', place: '한남테니스장', region: '용산구', open_at: at(-40), opened: true, period: '11/16~11/30', courts: hannam},
    {area: '장충', place: '장충테니스장', region: '중구', open_at: day(1, '10:00'), opened: false, period: '12/1~12/15', courts: jang}, forest];
  if (kind === 'late') openings = [
    {area: '한남', place: '한남테니스장', region: '용산구', open_at: at(-200), opened: true, period: '11/16~11/30', courts: hannam},
    {area: '장충', place: '장충테니스장', region: '중구', open_at: day(1, '10:00'), opened: false, period: '12/1~12/15', courts: jang}, forest];
  if (kind === 'next') openings = [{area: '장충', place: '장충테니스장', region: '중구', open_at: day(1, '10:00'), opened: false, period: '12/1~12/15', courts: jang}, forest];
  if (kind === 'soon') openings = [{area: '한남', place: '한남테니스장', region: '용산구', open_at: at(42), opened: false, period: '11/16~11/30', courts: hannam}, forest];
  const busy = new Set(openings.map((x) => x.area));
  const past = {'한남': [day(-12, '09:00')], '장충': [day(-2, '10:00'), day(-18, '10:00')], '선우공원': [day(-16, '09:30'), day(-50, '09:30')]};
  const places = AREAS.map((a) => ({area: a, place: NAMES[a], next_open: (openings.find((x) => x.area === a && !x.opened) || {}).open_at || '',
    available: (available.find((p) => p.area === a) || {courts: []}).courts.length, past_opens: busy.has(a) ? [] : (past[a] || [])}));
  return {now: mockStamp().slice(0, 16), updated_at: mockStamp(), badge: 0, areas: AREAS, places, openings, available};
}

/* ── 시작 ─────────────────────────────────────────────── */
async function init() {
  renderAreas();
  paintPush();
  onScroll();
  const slow = setTimeout(() => { const s = $('slow'); if (s) s.hidden = false; }, 6000);
  if (!MOCK) { worker().catch(() => {}); syncPush('auto'); }
  const ok = await loadBoard();
  clearTimeout(slow);
  if (!MOCK && ok === true && isStale()) refreshData();
}
setInterval(() => { if (!MOCK && document.visibilityState === 'visible') refreshData(); }, 180000);
setInterval(tick, 15000);
init();
</script>
