async function api(path,body){if(MOCK)return path==='/board'?mockBoard():{refreshed:false,reason:'recent',updated_at:mockStamp()};if(!/^\/(board|refresh|push\/(key|subscribe|unsubscribe|test))$/.test(path))throw Error('허용되지 않은 요청');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),65000);try{const r=await fetch(path,{signal:controller.signal,...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('서버 응답 오류');const d=await r.json();if(d.ok===false)throw Error('요청을 처리하지 못했어요');return d}finally{clearTimeout(timer)}}

function b64Bytes(s){const normalized=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(normalized+'='.repeat((4-normalized.length%4)%4)),c=>c.charCodeAt(0))}

async function syncPush(automatic=false){if(pushBusy)return;pushBusy=true;$('subscribe').disabled=true;try{if(MOCK){if(automatic)return;$('push-status').textContent='미리보기예요. 실제 알림은 서버에서 켤 수 있어요.';return}if(isiOS&&!standalone)return;if(!('Notification' in window)||!('PushManager' in window))throw Error('이 브라우저는 알림을 지원하지 않아요. 최신 Safari 또는 Chrome을 이용해주세요.');if(automatic&&Notification.permission!=='granted')return;if(!automatic&&!settings.areas.length)throw Error('관심 지역을 하나 이상 골라주세요.');if(!automatic){const permission=await Notification.requestPermission();if(permission!=='granted')throw Error(permission==='denied'?'브라우저 설정에서 이 사이트의 알림을 허용해주세요.':'알림 권한을 허용해야 소식을 받을 수 있어요.')}const reg=await worker();subscription=await reg.pushManager.getSubscription();if(automatic&&!subscription)return;const {publicKey}=await api('/push/key'),key=b64Bytes(publicKey);if(subscription&&!equalBytes(subscription.options.applicationServerKey,key)){const old=subscription;await old.unsubscribe();subscription=null;try{await api('/push/unsubscribe',{endpoint:old.endpoint})}catch{}}if(!subscription)subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});await api('/push/subscribe',{subscription:subscription.toJSON(),areas:settings.areas,d1:settings.d1,h1:settings.h1});settings.enabled=true;save();$('push-status').textContent='알림이 켜졌어요. 선택한 지역의 오픈 소식을 알려드릴게요.'}catch(e){$('push-status').textContent=(e.message&& !/fetch|network|abort/i.test(e.message))?e.message:'알림 연결이 어려워요. 알림 받기를 눌러 다시 시도해주세요.'}finally{pushBusy=false;$('subscribe').disabled=false;pushUI()}}
$('subscribe').onclick=()=>syncPush();$('unsubscribe').onclick=async()=>{if(pushBusy)return;pushBusy=true;try{if(!subscription)throw Error('켜진 알림이 없어요.');const old=subscription;await api('/push/unsubscribe',{endpoint:old.endpoint});await old.unsubscribe();subscription=null;settings.enabled=false;save();$('push-status').textContent='알림을 껐어요. 언제든 다시 켤 수 있어요.'}catch{$('push-status').textContent='알림 해제가 안 됐어요. 다시 시도해주세요.'}finally{pushBusy=false;pushUI()}};
