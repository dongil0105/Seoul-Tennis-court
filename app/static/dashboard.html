<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코트 오픈</title>
<meta name="description" content="한남·장충·마루공원·선우공원·서울숲 테니스장 예약 오픈 일정과 지금 접수 중인 코트">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코트 오픈">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 글꼴은 화면을 막지 않게 뒤에서 받는다(받기 전에는 기기 기본 글꼴) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
/* ── 토큰 ─────────────────────────────────────────────── */
:root{
  color-scheme:light dark;
  --bg:#FFFFFF; --band:#F3F4F6; --line:#ECEEF0; --line-2:#D9DDE1; --press:#F3F4F6;
  --ink:#15181B; --ink-2:#4A5158; --ink-3:#646C74; --ink-4:#868D94;
  --brand:#0C7A4A; --brand-weak:#EEF8F2;
  --alert:#C9371F; --on-alert:#FFFFFF;
  --shadow:0 -6px 32px rgba(15,23,30,.14);
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111315; --band:#08090A; --line:#22262A; --line-2:#33383D; --press:#1A1D20;
    --ink:#F2F4F5; --ink-2:#BBC1C7; --ink-3:#8E959C; --ink-4:#6E757C;
    --brand:#56CF98; --brand-weak:#11221A;
    --alert:#FF8D78; --on-alert:#2B0B05;
    --shadow:0 -6px 32px rgba(0,0,0,.55);
  }
}

/* ── 기본 ─────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
summary::-webkit-details-marker{display:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--bg)}
@media (min-width:560px){
  body{background:var(--band)}
  .app{box-shadow:0 0 0 1px var(--line)}
}

/* ── 상단 바 ──────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0 20px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-height:44px;font-size:16px;font-weight:700;letter-spacing:-.03em}
.brand svg{width:28px;height:28px;border-radius:8px}
.bar-actions{display:flex;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 8px;border-radius:12px;
  font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sync svg{width:16px;height:16px}
.sync[aria-busy=true] svg{animation:spin .8s linear infinite}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.on{color:var(--brand)}
.sync:active,.icon-btn:active{background:var(--press)}

/* ── 맨 위: 다음 예약 오픈 / 방금 열린 예약 ───────────── */
.next{padding:20px 20px 24px}
.next.has-peek{padding-bottom:0}
.next.is-open{background:var(--brand-weak)}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-3)}
.eyebrow.live{font-size:14px;color:var(--brand)}
.next-date{margin-top:12px;font-size:16px;font-weight:600;color:var(--ink-2)}
.next-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.next-h{min-width:0;font-size:inherit;font-weight:inherit;line-height:inherit}
.next-time{display:block;margin-left:-2px;font-size:56px;line-height:1.1;font-weight:700;letter-spacing:-.04em}
.next-venue{display:block;margin-top:8px;font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.03em}
.next-meta{margin-top:4px;font-size:14px;color:var(--ink-3)}
.remain{flex:none;display:inline-flex;align-items:center;height:32px;margin-top:15px;padding:0 12px;border-radius:8px;
  background:var(--brand-weak);color:var(--brand);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.remain.soon{background:var(--alert);color:var(--on-alert)}
.alarm{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:20px;
  border:1px solid var(--line-2);border-radius:12px;font-size:16px;font-weight:600}
.alarm svg{width:20px;height:20px}
.alarm.on{border-color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent);color:var(--brand)}
.alarm:active{background:var(--press)}
.peek{margin-top:4px}
.peek>summary{display:flex;align-items:center;justify-content:space-between;min-height:52px;
  font-size:14px;font-weight:600;color:var(--ink-2)}
.peek .picker{padding-bottom:20px}
.chev{width:20px;height:20px;color:var(--ink-4);transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}

.opened+.opened{margin-top:28px;padding-top:24px;border-top:1px solid var(--line-2)}
.venue-title{margin-top:8px;font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.03em}
.opened .picker{margin-top:16px}
.note{margin-top:16px;font-size:13px;line-height:1.5;color:var(--ink-2)}

.none-title{margin-top:12px;font-size:20px;line-height:1.4;font-weight:700;letter-spacing:-.03em}
.none-sub{margin-top:8px;font-size:14px;color:var(--ink-3)}
.retry{display:inline-flex;align-items:center;height:48px;margin-top:20px;padding:0 20px;border-radius:12px;
  border:1px solid var(--line-2);font-size:16px;font-weight:600}

/* ── 섹션 ─────────────────────────────────────────────── */
.band{height:8px;background:var(--band)}
.sec{padding:24px 20px 8px}
.sec h2{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.03em}
.sec-sub{margin-top:4px;font-size:13px;color:var(--ink-3)}
.sub-label{margin-top:24px;font-size:13px;font-weight:600;color:var(--ink-3)}
.app.is-error .band,.app.is-error #schedule,.app.is-error #available,.app.is-error #play{display:none}

.rows{margin-top:8px}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>summary{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:72px;padding:12px 0}
.when,.what,.when>*,.what>*{display:block}
.when b{font-size:16px;line-height:1.4;font-weight:700;font-variant-numeric:tabular-nums}
.when span{font-size:13px;color:var(--ink-3)}
.what strong{font-size:16px;line-height:1.4;font-weight:600}
.what span{font-size:13px;line-height:1.5;color:var(--ink-3)}
.tail{display:flex;align-items:center;gap:8px}
.dday{padding:4px 8px;border-radius:8px;background:var(--band);color:var(--ink-2);
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dday.near{background:var(--brand-weak);color:var(--brand)}
.row .picker{padding-bottom:16px}
.row-note{padding-bottom:16px;font-size:13px;color:var(--ink-3)}
.frow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:72px;padding:12px 0}
.frow .tail{padding-right:28px}   /* 펼침 표시가 없는 줄도 날짜 표시의 오른쪽 끝을 맞춘다 */
.what .nx{color:var(--ink-2)}     /* 다음 오픈 — 회차 이름보다 한 톤 진하게 */
.pend{padding:12px 0;border-bottom:1px solid var(--line)}
.pend:last-child{border-bottom:0}

/* ── 지금 접수 중인 코트 ──────────────────────────────── */
.venue{padding:20px 0;border-bottom:1px solid var(--line)}
.venue:last-child{border-bottom:0}
.venue h3{display:flex;align-items:baseline;gap:8px;font-size:16px;line-height:1.4;font-weight:700;letter-spacing:-.03em}
.venue h3 span{font-size:13px;font-weight:400;letter-spacing:-.01em;color:var(--ink-3)}
.venue-meta{margin-top:4px;font-size:13px;color:var(--ink-3)}
.venue-next{margin-top:2px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.venue-next+.batch{margin-top:8px}
.batch+.batch{margin-top:20px}
.venue .picker{margin-top:12px}
.venue.has-more{padding-bottom:8px}
.more{margin-top:8px}
.more>summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;
  font-size:14px;font-weight:600;color:var(--ink-2)}
.more .batch+.batch{margin-top:4px}
.more .venue-meta{margin:0}
.more .picker{margin-top:8px;padding-bottom:16px}

/* 접수 중인 코트가 없는 곳: 이름 · 상태 한 줄 — 누르면 코트별 예약 화면 링크가 펼쳐진다 */
.vrow>summary,.vrow.flat{grid-template-columns:minmax(0,1fr) auto;min-height:64px}
.vrow.flat{display:grid;align-items:center;gap:12px;padding:12px 0}
.vrow.flat .tail{padding-right:28px}   /* 펼침 표시가 없는 줄도 상태 표시의 오른쪽 끝을 맞춘다 */
.vrow .batch+.batch{margin-top:4px}
.vrow .venue-meta{margin:0 0 8px}
/* 접수하지 않는 코트 버튼: 누를 수는 있지만 한 톤 낮춘다 */
.shut .court b,.shut .court b small,.shut .mno,.shut .mno small,.shut .chip span{color:var(--ink-3)}

/* 코트 고르기: 코트마다 예약이 하나면 번호 타일, 여럿이면 '코트 번호 | 시간대 버튼' 줄 */
.group+.group{margin-top:16px}
.group-label{margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.courts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.courts[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.courts[data-cols="1"]{grid-template-columns:minmax(0,1fr)}
.court,.chip{display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line-2);border-radius:12px;
  background:var(--bg);transition:background .12s,border-color .12s}
.court{gap:2px;min-height:64px;padding:8px 12px}
.court b,.mno{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.court b small,.mno small{margin-left:1px;font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--ink-2)}
.court b.word{font-size:16px}
.court span{font-size:13px;line-height:1.4;color:var(--ink-2)}
.court span.sub,.chip span.sub{font-size:13px;font-weight:400;color:var(--ink-3)}
.matrix{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:4px}
.mchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mchips[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.chip{min-height:52px;padding:6px 12px}
.mchips[data-cols="3"] .chip{padding-left:8px;padding-right:8px}
.chip span{font-size:14px;line-height:1.4;font-weight:600}
.chip.col2{grid-column:2}
.court em,.chip em{font-style:normal;font-weight:600;color:var(--brand)}
.court:active,.chip:active{background:var(--press)}
@media (hover:hover){.court:hover,.chip:hover{border-color:var(--ink-4)}}
.off{opacity:.5}

/* ── 반포종합운동장(테니스플레이) 빈 시간 ─────────────── */
.seg{display:flex;gap:8px;margin-top:16px}
.seg button{flex:1;min-width:0;height:44px;border:1px solid var(--line-2);border-radius:12px;
  font-size:14px;font-weight:600;color:var(--ink-2);transition:background .12s,border-color .12s,color .12s}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.seg button:not([aria-pressed=true]):active{background:var(--press)}
.prow>summary,.prow.frow{grid-template-columns:60px minmax(0,1fr) auto}
.prow .when span{white-space:nowrap}
.prow .what strong.dim{font-weight:500;color:var(--ink-3)}
.phours{display:grid;gap:8px;padding:4px 0 12px}
.phour{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:start;gap:8px}
.ph{padding-top:5px;font-size:14px;font-weight:600;color:var(--ink-2)}
.ptags{display:flex;flex-wrap:wrap;gap:6px}
.ptag{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:8px;
  background:var(--brand-weak);color:var(--brand);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.pbook{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;margin-bottom:16px;
  border:1px solid var(--line-2);border-radius:12px;font-size:16px;font-weight:600}
.pbook svg{width:18px;height:18px;color:var(--ink-3)}
.pbook:active{background:var(--press)}
.pbook.solo{margin-top:20px}
.play-note{padding:12px 0 16px;font-size:13px;line-height:1.5;color:var(--ink-3)}
#play{scroll-margin-top:64px}
#play .alarm{margin:0 0 16px}
.sheet-hint{margin-top:8px;font-size:13px;line-height:1.5;color:var(--ink-3)}

/* ── 새 알림: 받은 알림을 앱 안에서도 ─────────────────── */
.fresh{margin:4px 20px 0;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.fresh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:16px}
.fresh-head h2{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.4;font-weight:700}
.fresh-head h2::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--alert)}
.fresh-x{flex:none;height:44px;padding:0 16px;font-size:13px;font-weight:500;color:var(--ink-3)}
.fresh-item{display:block;width:100%;padding:10px 16px 12px;border-top:1px solid var(--line);text-align:left}
.fresh-item b{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:15px;font-weight:600}
.fresh-item b small{flex:none;font-size:13px;font-weight:400;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fresh-item span{display:block;margin-top:2px;font-size:14px;line-height:1.5;color:var(--ink-2);white-space:pre-line}
.fresh-item:active,.fresh-x:active{background:var(--press)}
.fresh-more{padding:8px 16px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.newtag{display:inline-block;flex:none;margin-left:8px;padding:0 6px;border-radius:8px;background:var(--alert);color:var(--on-alert);
  font-size:13px;line-height:1.5;font-weight:700;font-style:normal;letter-spacing:0;vertical-align:middle;white-space:nowrap}
.venue h3 .newtag{margin-left:0;align-self:center}

.empty{margin-top:12px;padding:20px 0 24px}
.empty strong{display:block;font-weight:600}
.empty p{margin-top:4px;font-size:14px;color:var(--ink-3)}

/* ── 설정 줄 · 꼬리말 ─────────────────────────────────── */
.cells{padding:4px 20px}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;text-align:left;border-bottom:1px solid var(--line)}
.cell:last-child{border-bottom:0}
.cell .lead{width:22px;height:22px;color:var(--ink-2)}
.cell .t{flex:1;font-weight:500}
.cell .v{font-size:14px;color:var(--ink-3)}
.cell .v.on{font-weight:600;color:var(--brand)}
.cell .chev-r{width:20px;height:20px;color:var(--ink-4)}
.cell:active{background:var(--press)}
.foot{padding:16px 20px calc(28px + env(safe-area-inset-bottom));font-size:13px;line-height:1.6;color:var(--ink-3)}

/* ── 알림 시트 ────────────────────────────────────────── */
dialog{width:100%;max-width:520px;max-height:90vh;max-height:min(90dvh,760px);margin:auto auto 0;padding:0;border:0;
  border-radius:20px 20px 0 0;background:var(--bg);color:var(--ink);box-shadow:var(--shadow);overflow:auto}
dialog::backdrop{background:rgba(8,10,12,.52)}
dialog[open]{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:560px){dialog{max-width:440px;margin:auto;border-radius:20px}}
.sheet{padding:8px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;min-height:56px;margin-right:-10px}
.sheet-head h2{font-size:20px;font-weight:700;letter-spacing:-.03em}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;
  border-bottom:1px solid var(--line);cursor:pointer}
.switch:last-of-type{border-bottom:0}
.switch.master{min-height:72px;border-bottom:0}
.switch.master b{display:block;font-weight:600}
.switch.master small{display:block;margin-top:2px;font-size:13px;line-height:1.5;color:var(--ink-3)}
.switch input{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:52px;height:32px;margin:0;
  border-radius:16px;background:var(--ink-4);transition:background .2s;cursor:pointer}
.switch input::before{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;
  background:var(--bg);transition:transform .2s}
.switch input:checked{background:var(--brand)}
.switch input:checked::before{transform:translateX(20px)}
.switch input:disabled{opacity:.4;cursor:default}
.push-status{margin-top:4px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.push-status:empty{display:none}
.install{margin-top:12px;padding:16px;border-radius:12px;background:var(--band);font-size:14px}
.install strong{display:block;font-weight:600}
.install p{margin-top:4px;color:var(--ink-2)}
.install ol{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
.install li{padding:2px 0}
.sheet-label{margin:24px 0 4px;font-size:13px;font-weight:600;color:var(--ink-3)}
.pick{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;
  border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-of-type{border-bottom:0}
.pick input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pick svg{width:24px;height:24px}
.pick svg circle{fill:none;stroke:var(--ink-4);stroke-width:1.8}
.pick svg path{stroke:transparent;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pick input:checked~svg circle{fill:var(--brand);stroke:var(--brand)}
.pick input:checked~svg path{stroke:var(--bg)}
.pick input:focus-visible~span{outline:2px solid var(--brand);outline-offset:4px;border-radius:8px}
.text-btn{min-height:44px;font-size:14px;font-weight:500;color:var(--ink-2);
  text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:4px}
.sheet-foot{margin-top:12px}

/* ── 토스트 · 뼈대 ────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:60;
  max-width:min(92vw,440px);padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);
  font-size:14px;font-weight:500;text-align:center;opacity:0;transform:translate(-50%,8px);pointer-events:none;
  transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sk{border-radius:8px;background:var(--band)}
.slow{margin-top:16px;font-size:13px;color:var(--ink-3)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-color-scheme:dark){.brand svg{box-shadow:0 0 0 1px var(--line-2)}}
@media (max-width:359px){
  .next,.sec,.cells,.foot{padding-left:16px;padding-right:16px}
  .bar{padding-left:16px}
  .next-time{font-size:48px}
  .remain{margin-top:11px}
  .court{padding-left:8px;padding-right:8px}
}

<body>
<div class="app" id="app">
  <header class="bar" id="bar">
    <a class="brand" href="/" aria-label="코트 오픈 홈">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="#0E2A20"/><circle cx="16" cy="16" r="8.5" fill="#D8F25C"/><path d="M9.6 10.4c2.7 1.6 4.1 3.5 4.1 5.6s-1.4 4-4.1 5.6M22.4 10.4c-2.7 1.6-4.1 3.5-4.1 5.6s1.4 4 4.1 5.6" fill="none" stroke="#0E2A20" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>코트 오픈</span>
    </a>
    <div class="bar-actions">
      <button class="sync" id="refresh" aria-label="서울시 정보 새로 고침">
        <span id="stamp">불러오는 중</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="bell" data-act="sheet" aria-label="오픈 알림 설정"></button>
    </div>
  </header>

  <main>
    <section class="fresh" id="fresh" aria-label="새 알림" hidden></section>
    <section class="next" id="next" aria-label="다음 예약 오픈">
      <div class="sk" style="width:96px;height:16px"></div>
      <div class="sk" style="width:160px;height:20px;margin-top:16px"></div>
      <div class="sk" style="width:180px;height:56px;margin-top:8px"></div>
      <div class="sk" style="width:170px;height:28px;margin-top:12px"></div>
      <div class="sk" style="width:220px;height:16px;margin-top:8px"></div>
      <p class="slow" id="slow" hidden>불러오는 중이에요. 처음 열 때는 30초쯤 걸릴 수 있어요.</p>
    </section>

    <div class="band" id="band-next" hidden></div>
    <section class="sec" id="schedule" aria-label="오픈 일정" hidden></section>

    <div class="band"></div>
    <section class="sec" id="available" aria-label="지금 접수 중인 코트">
      <div class="sk" style="width:150px;height:24px"></div>
      <div class="sk" style="height:64px;margin-top:20px;border-radius:12px"></div>
      <div class="sk" style="height:64px;margin:8px 0 16px;border-radius:12px"></div>
    </section>

    <div class="band" id="band-play" hidden></div>
    <section class="sec" id="play" aria-label="반포종합운동장 빈 시간" hidden></section>

    <div class="band"></div>
    <div class="cells">
      <button class="cell" data-act="sheet">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 8H4c0-1.5 2-3 2-8Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="t">오픈 알림</span><span class="v" id="push-value">꺼짐</span>
        <svg class="chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="cell" id="share">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        <span class="t">친구에게 공유</span>
        <svg class="chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
    <footer class="foot">서울시 공공서비스예약에 올라온 정보를 그대로 보여 드려요. ‘공지 일정’은 시설 안내문에 적힌 정기 오픈 날짜라 실제와 다를 수 있어요.</footer>
  </main>
</div>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="sheet-title" tabindex="-1">오픈 알림</h2>
      <button class="icon-btn" id="sheet-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <label class="switch master">
      <span><b>이 기기로 알림 받기</b><small>예약이 열리기 전날 아침과 1시간 전에 알려 드려요.</small></span>
      <input type="checkbox" role="switch" id="master">
    </label>
    <p class="push-status" id="push-status" role="status"></p>
    <div class="install" id="install" hidden></div>
    <div id="prefs">
      <p class="sheet-label" id="areas-label">알림 받을 테니스장</p>
      <div id="areas" role="group" aria-labelledby="areas-label"></div>
      <p class="sheet-hint" id="play-hint" hidden>반포는 매일 09:00에 7일 뒤 날짜가 열려요. 전날 20시와 1시간 전에 알려 드려요.</p>
      <p class="sheet-label" id="when-label">알림 시간</p>
      <div role="group" aria-labelledby="when-label">
        <label class="switch"><span>오픈 전날</span><input type="checkbox" role="switch" id="d1"></label>
        <label class="switch"><span>오픈 1시간 전</span><input type="checkbox" role="switch" id="h1"></label>
        <label class="switch" id="free-row" hidden><span>반포에 빈 시간이 생기면</span><input type="checkbox" role="switch" id="free"></label>
      </div>
    </div>
    <div class="sheet-foot"><button class="text-btn" id="test" hidden>테스트 알림 보내기</button></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px 20px">이 앱은 자바스크립트를 켜야 볼 수 있어요.</p></noscript>

<script>
'use strict';
/* 코트 오픈 — 화면 스크립트.
   서버(/board, /refresh, /push/*)만 호출한다. 서울시 예약 사이트 주소는 사람이 누르는 링크로만 쓴다. */
const $ = (id) => document.getElementById(id);
const sheet = $('sheet');
const MOCK = new URLSearchParams(location.search).get('mock');   // opened | late | next | soon | none | empty | notice | passed | play | playfull | playerr | new | playnew | feed | playfeed
const AREAS = ['한남', '장충', '마루공원', '선우공원', '서울숲'];
const NAMES = {'한남': '한남테니스장', '장충': '장충테니스장', '마루공원': '마루공원', '선우공원': '선우공원', '서울숲': '서울숲 테니스장', '반포': '반포종합운동장'};
// 반포(테니스플레이) 알림 — 고른 기기에만 간다. PLAY_AREA = 예약 오픈 예고, PLAY_FREE = 빈 시간이 새로 생기면
const PLAY_AREA = '반포', PLAY_FREE = '반포 빈 시간';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// 예약 링크는 서울시 사이트일 때만 걸고, 항상 https 로 연다.
const safeURL = (s) => {
  try {
    const u = new URL(s);
    if (!/(^|\.)seoul\.go\.kr$/.test(u.hostname)) return '';
    if (u.protocol === 'http:') u.protocol = 'https:';
    return u.protocol === 'https:' ? u.href : '';
  } catch { return ''; }
};
class UserError extends Error {}     // 사용자에게 그대로 보여 줘도 되는 안내 문구

const ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 8H4c0-1.5 2-3 2-8Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  bellOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 8H4c0-1.5 2-3 2-8Z"/><path d="M10 20a2 2 0 0 0 4 0" fill="none"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.3 3 3 6-6.4"/></svg>',
};

/* ── 시간: 서버 문자열은 모두 한국 시간 'YYYY-MM-DD HH:MM[:SS]' ─────── */
let skew = 0;                                   // 서버 시계 − 기기 시계(ms). 기기 시계가 틀려도 서버 기준으로 계산한다.
const nowMs = () => Date.now() + skew;
const WD = ['일', '월', '화', '수', '목', '금', '토'];
function kstMs(s) {
  s = String(s || '');
  if (s.length < 16) return NaN;
  return Date.parse(`${s.slice(0, 10)}T${s.slice(11, 16)}:${s.length >= 19 ? s.slice(17, 19) : '00'}+09:00`);
}
const dayFmt = new Intl.DateTimeFormat('sv-SE', {timeZone: 'Asia/Seoul'});
const todayKST = () => dayFmt.format(new Date(nowMs()));
const ymd = (s) => ({y: +s.slice(0, 4), m: +s.slice(5, 7), d: +s.slice(8, 10)});
const utcDay = (s) => { const {y, m, d} = ymd(s); return Date.UTC(y, m - 1, d); };
const weekday = (s) => WD[new Date(utcDay(s)).getUTCDay()];
const dayDiff = (s) => Math.round((utcDay(s) - utcDay(todayKST())) / 864e5);
const longDate = (s) => { const {m, d} = ymd(s); return `${m}월 ${d}일 ${weekday(s)}요일`; };
const shortDate = (s) => { const {m, d} = ymd(s); return `${m}.${d}`; };
const hm = (s) => String(s).slice(11, 16);
function remainText(ms, openAt) {
  if (ms <= 0) return '지금 열려요';
  if (ms < 6e5) {                               // 10분 안쪽은 초까지
    const t = Math.ceil(ms / 1000);
    return t < 60 ? `${t}초 남음` : `${Math.floor(t / 60)}분 ${String(t % 60).padStart(2, '0')}초 남음`;
  }
  const min = Math.ceil(ms / 60000);
  if (min < 60) return `${min}분 남음`;
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 24) return m ? `${h}시간 ${m}분 남음` : `${h}시간 남음`;
  if (h < 48) return h % 24 ? `1일 ${h % 24}시간 남음` : '1일 남음';
  return `${dayDiff(openAt)}일 남음`;           // 이틀 넘게 남으면 달력 날짜 기준(일정 줄의 D-n 과 같게)
}
const isSoon = (ms) => Math.ceil(ms / 60000) < 60;
const ddayText = (n) => (n <= 0 ? '오늘' : n === 1 ? '내일' : `D-${n}`);

/* ── 코트 고르기 ──────────────────────────────────────── */
const STATE_TEXT = {full: '마감', ended: '접수 끝남', paused: '일시중지', unknown: '접수 상태 확인 필요'};   // 접수하지 않는 코트
const isLit = (c) => /조명/.test(c.court || '');
const courtNo = (c) => { const m = /^(\d+)/.exec(c.court || ''); return m ? +m[1] : 999; };
const isNumbered = (c) => /^(\d+|[A-Za-z])/.test(String(c.court || ''));
const physKey = (c) => String(c.court || '').replace(/\s*조명$/, '').trim();      // 같은 면의 조명 예약은 같은 코트
// '평일 야간 · 주말·공휴일' → '평일 야간, 주말·휴일'. 가운뎃점 앞뒤에서는 줄이 바뀌지 않게 한다(U+2060).
const shortSlot = (s) => (!s || s === '매일' ? '' : String(s).replace(/주말·공휴일/g, '주말·휴일').replace(/\s+·\s+/g, ', ').replace(/·/g, '\u2060·\u2060'));
function hoursText(t) {
  const m = /^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/.exec(String(t || '').trim());
  if (!m) return '';
  return m[2] === '00' && m[4] === '00' ? `${+m[1]}~${+m[3]}시` : `${+m[1]}:${m[2]}~${+m[3]}:${m[4]}`;
}
/* day = 평일 낮, night = 야간·주말·공휴일(토·일 포함), any = 구분 없음 */
function slotKind(c) {
  const s = c.slot || '';
  if (/야간|주말|공휴일/.test(s) || /(^|[\s·,])[토일](?=$|[\s·,])/.test(s)) return 'night';
  if (/평일|주간|새벽/.test(s) || /(^|[\s·,])[월화수목금](?=$|[\s·,])/.test(s)) return 'day';
  return 'any';
}
const KIND_ORDER = {day: 0, night: 1, any: 2};
function kindLabel(k, list) {
  const has = (re) => list.some((c) => re.test(c.slot || ''));
  if (k === 'day') return has(/새벽/) ? '평일 새벽 · 주간' : has(/주간/) ? '평일 주간' : '평일';
  if (k === 'night') {
    const wk = has(/주말|공휴일|(^|[\s·,])[토일](?=$|[\s·,])/);
    return [has(/야간/) ? '야간' : '', wk ? (has(/공휴일/) ? '주말 · 공휴일' : '주말') : ''].filter(Boolean).join(' · ') || '야간 · 주말';
  }
  return '상시';
}
/* 실제 코트 수 — 같은 코트의 시간대별 예약은 한 번만 센다. 번호 없는 예약이 섞이면 세지 않는다. */
function courtCount(courts) {
  const list = courts || [];
  return list.length && list.every(isNumbered) ? new Set(list.map(physKey)).size : 0;
}
/* 모든 코트의 운영 시간이 같으면 그 시간 — 버튼에서는 빼고 위 설명에 한 번만 쓴다. */
function commonHours(courts) {
  const list = courts || [];
  if (!list.length || !list.every(isNumbered) || new Set(list.map((c) => c.time)).size > 1) return '';
  return hoursText(list[0].time);
}
function courtLines(c, ctx) {
  const tags = [], slot = shortSlot(c.slot), hours = hoursText(c.time);
  if (slot) tags.push(esc(slot));
  if (isLit(c)) tags.push('조명');
  if (!c.is_paid) tags.push('<em>무료</em>'); else if (ctx.mixedFee) tags.push('유료');
  if (ctx.mixedConfirm && c.confirmed) tags.push('<em>접수 중</em>');
  if (ctx.mixedState && STATE_TEXT[c.state]) tags.push(STATE_TEXT[c.state]);
  return {slot, tags, hours: ctx.hideHours ? '' : hours,
    label: [c.court, c.slot, hours, c.is_paid ? '' : '무료', STATE_TEXT[c.state] || '', '예약 화면 열기'].filter(Boolean).join(', ')};
}
function linkHTML(cls, c, inner, label) {
  const u = safeURL(c.reserve_url);
  return u
    ? `<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(label)}">${inner}</a>`
    : `<span class="${cls} off" aria-disabled="true">${inner}</span>`;
}
const unitOf = (m) => m[2] || (/\d/.test(m[1]) ? '번' : '코트');
function tileHTML(c, ctx) {                     // 코트 번호가 주인공인 버튼
  const m = /^(\d+|[A-Za-z])\s*(번|면)?/.exec(String(c.court || ''));
  const {slot, tags, hours, label} = courtLines(c, ctx);
  const head = m ? `<b>${esc(m[1])}<small>${unitOf(m)}</small></b>` : `<b class="word">${slot ? esc(slot) : '예약'}</b>`;
  const rest = !m && slot ? tags.slice(1) : tags;
  return linkHTML('court', c, head + (rest.length ? `<span>${rest.join(' · ')}</span>` : '')
    + (hours ? `<span class="sub num">${esc(hours)}</span>` : ''), label);
}
function chipHTML(c, ctx, col2) {               // 코트 번호 옆에 놓이는 시간대 버튼
  const {tags, hours, label} = courtLines(c, ctx);
  return linkHTML('chip' + (col2 ? ' col2' : ''), c, `<span>${tags.length ? tags.join(' · ') : '예약'}</span>`
    + (hours ? `<span class="sub num">${esc(hours)}</span>` : ''), label);
}
function pickerHTML(courts, keepHours) {
  const list = [...(courts || [])].sort((a, b) => (courtNo(a) - courtNo(b)) || physKey(a).localeCompare(physKey(b), 'ko')
    || (KIND_ORDER[slotKind(a)] - KIND_ORDER[slotKind(b)]) || (isLit(a) - isLit(b))
    || String(a.slot).localeCompare(String(b.slot), 'ko'));
  const ctx = {
    mixedFee: list.some((c) => c.is_paid) && list.some((c) => !c.is_paid),
    mixedConfirm: list.some((c) => c.confirmed) && list.some((c) => !c.confirmed),
    hideHours: !keepHours && Boolean(commonHours(list)),
    mixedState: new Set(list.map((c) => c.state || '')).size > 1,
  };
  if (list.length && list.every(isNumbered)) {
    const byCourt = new Map();
    list.forEach((c) => { const k = physKey(c); byCourt.set(k, [...(byCourt.get(k) || []), c]); });
    const rows = [...byCourt.values()];
    const cols = Math.min(3, Math.max(...rows.map((l) => l.length)));
    if (cols > 1) {                             // 한 코트에 예약이 여럿 → 코트 번호는 한 번만, 시간대를 옆에
      const paired = rows.some((l) => l.length === 2 && slotKind(l[0]) === 'day' && slotKind(l[1]) === 'night');
      return `<div class="picker matrix">${rows.map((l) => {
        const m = /^(\d+|[A-Za-z])\s*(번|면)?/.exec(physKey(l[0]));
        const col2 = cols === 2 && paired && l.length === 1 && slotKind(l[0]) === 'night';
        return `<div class="mrow"><b class="mno">${esc(m[1])}<small>${unitOf(m)}</small></b>`
          + `<div class="mchips" data-cols="${cols}">${l.map((c) => chipHTML(c, ctx, col2)).join('')}</div></div>`;
      }).join('')}</div>`;
    }
  }
  const groups = ['day', 'night', 'any'].map((k) => [k, list.filter((c) => slotKind(c) === k)]).filter(([, l]) => l.length);

const dots = (t) => String(t || '').replace(/(\d{1,2})\/(\d{1,2})/g, '$1.$2');
const periodText = (p) => (!p ? '' : /이용분$/.test(p) ? dots(p) : `${dots(p)} 이용분`);

/* ── 새 알림: 받은 알림을 앱 안에서도 보여 준다 ─────────
   서비스워커(sw.js)가 알림을 받을 때마다 보관함(Cache 'tn-inbox')에 적어 둔다. 앱을 열면 그것을 읽어 맨 위와
   그 테니스장 이름 옆에 '새 알림'으로 보여 주고 보관함을 비운다 → 앱 아이콘 숫자(아직 안 본 알림 수)도 지운다.
   한 번 본 알림은 10분이 지난 뒤 앱을 다시 열면 사라진다.
   카카오톡으로만 받았거나 앱 알림이 이 기기에 도착하지 못한 알림은 서버의 보낸 알림 기록(/board 의 feed)에서 읽어
   같은 자리에 보여 준다(아래 takeFeed). */
const FRESH_KEEP = 10 * 60000, FRESH_AGE = 24 * 36e5, FRESH_ROWS = 5;
let fresh = [];
function freshItem(x) {
  if (!x || typeof x !== 'object' || typeof x.text !== 'string' || !x.text.trim() || !Number.isFinite(x.at)) return null;
  const s = (v, n) => String(v ?? '').slice(0, n);
  return {area: s(x.area, 20), place: s(x.place, 40), kind: s(x.kind, 10), key: s(x.key || x.text, 120),
    text: s(x.text, 300), at: x.at, seen: Number.isFinite(x.seen) ? x.seen : 0};
}
if (!MOCK) {
  try {
    const v = JSON.parse(localStorage.getItem('tn_fresh')), t = Date.now();
    if (Array.isArray(v)) fresh = v.map(freshItem).filter((x) => x && t - x.seen < FRESH_KEEP && t - x.at < FRESH_AGE);
  } catch {}
} else if (/new$/.test(MOCK)) {                       // 미리보기 ?mock=new · ?mock=playnew
  const t = Date.now();
  fresh = [{area: '한남', place: '한남테니스장', kind: 'd1', key: 'open|a', text: '11.14(토) 09:00 예약 오픈', at: t - 5 * 60000, seen: t},
    ...(MOCK === 'playnew' ? [
      {area: '반포', place: '반포종합운동장 테니스장', kind: 'd1', key: 'open|b', text: '11.14(토) 09:00 예약 오픈 · 11.21(토) 이용분', at: t - 5 * 60000, seen: t},
      {area: '반포', place: '반포종합운동장 테니스장', kind: 'free', key: 'free|c', text: '11.16(월) 14~15시 · 3번 코트\n11.17(화) 14~15시 · 2번, 6번 코트', at: t - 60000, seen: t}] : [])];
}
const saveFresh = () => { if (!MOCK) { try { localStorage.setItem('tn_fresh', JSON.stringify(fresh)); } catch {} } };

/* 보낸 알림 기록(/board 의 feed) — 서버가 최근 24시간에 보낸 알림(카카오톡 · 앱 알림).
   이 기기에서 이미 보여 준 알림은 seenAt(곳|key|종류 → 보낸 때)에 적어 두어 다시 '새 알림'으로 뜨지 않게 한다. */
const FEED_TOL = 5 * 60000;                           // 같은 알림으로 보는 시각 차(앱 알림이 도착한 때 ↔ 서버가 보낸 때)
let seenAt = {};
if (!MOCK) {
  try {
    const v = JSON.parse(localStorage.getItem('tn_seen')), t = Date.now();
    if (v && typeof v === 'object') {
      Object.keys(v).forEach((k) => { if (Number.isFinite(v[k]) && t - v[k] < 2 * FRESH_AGE) seenAt[k] = v[k]; });
    }
  } catch {}
}
const seenId = (x) => `${x.area}|${x.key}|${x.kind}`;
function markSeen(x) { const id = seenId(x); if (!(seenAt[id] >= x.at)) seenAt[id] = x.at; }
function saveSeen() {
  if (MOCK) return;
  const t = Date.now();
  Object.keys(seenAt).forEach((k) => { if (t - seenAt[k] >= 2 * FRESH_AGE) delete seenAt[k]; });
  try { localStorage.setItem('tn_seen', JSON.stringify(seenAt)); } catch {}
}
// 카카오톡 알림에 든 링크(…?k=1)로 연 브라우저 = 카카오톡 알림을 받는 사람 → 서버가 보낸 알림을 모두 보여 준다.
let showAll = new URLSearchParams(location.search).has('k');
if (!MOCK) {
  try { if (showAll) localStorage.setItem('tn_all', '1'); else showAll = localStorage.getItem('tn_all') === '1'; } catch {}
}
// 이 기기가 받기로 한 알림인가 — 알림 설정에서 고른 곳 · 시간(알림을 켜지 않은 기기는 기본값 = 5곳의 오픈 알림).
function feedWanted(x, areas) {
  if (showAll) return true;
  if (x.kind === 'free') return settings.free === true;
  if ((x.kind === 'd1' && !settings.d1) || (x.kind === 'h1' && !settings.h1)) return false;
  return areas.some((a) => settings.areas.includes(a));
}
/* 보낸 알림 기록에서 이 기기가 아직 보여 주지 않은 것을 '새 알림'에 넣는다. 넣은 것이 있으면 true(그리기는 부른 쪽에서). */
function takeFeed(list) {
  if (!Array.isArray(list) || document.visibilityState !== 'visible') return false;   // 화면을 보고 있을 때만 '보여 줬다'고 적는다
  const now = Date.now();
  let added = false, noted = false;
  list.forEach((raw) => {
    const x = freshItem(raw);
    if (!x || now - x.at >= FRESH_AGE) return;
    const areas = Array.isArray(raw.areas) ? raw.areas.filter((a) => typeof a === 'string' && a) : [];
    if (!feedWanted(x, areas.length ? areas : [x.area])) return;
    const id = seenId(x);
    if (seenAt[id] >= x.at - FEED_TOL) return;         // 이미 보여 준 알림(앱 알림으로 먼저 받았거나 지난번에 봄)
    seenAt[id] = x.at;
    noted = true;
    const same = fresh.find((y) => y.area === x.area && y.key === x.key);
    if (same && same.at >= x.at - FEED_TOL) return;    // 같은 알림이 이미 떠 있음
    fresh = fresh.filter((y) => !(y.area === x.area && y.key === x.key));   // 전날 알림 → 1시간 전 알림은 한 줄로
    fresh.push({...x, seen: now});
    added = true;

  if (added) saveFresh();

}
// 그 테니스장 이름 옆에 붙이는 표시
const newTag = (area) => (area && fresh.some((x) => x.area === area) ? `<em class="newtag" data-area="${esc(area)}">새 알림</em>` : '');
const freshName = (x) => (NAMES[x.area] || x.place || '코트 오픈') + (x.kind === 'free' ? ' 빈 시간' : '');
const clockFmt = new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
function freshWhen(at) {                              // 알림을 받은 때: '오늘 20:00' · '어제 20:00' · '11.12 20:00'
  const d = new Date(at), day = dayFmt.format(d), diff = dayDiff(day);
  return `${diff === 0 ? '오늘' : diff === -1 ? '어제' : shortDate(day)} ${clockFmt.format(d)}`;
}
function paintFreshBar() {
  const el = $('fresh'), list = [...fresh].sort((a, b) => b.at - a.at);
  el.hidden = !list.length;
  el.innerHTML = !list.length ? ''
    : `<div class="fresh-head"><h2>새 알림 ${list.length}건</h2><button class="fresh-x" data-act="fresh-x">닫기</button></div>`
      + list.slice(0, FRESH_ROWS).map((x) => `<button class="fresh-item" data-act="fresh-go" data-area="${esc(x.area)}">
        <b>${esc(freshName(x))}<small>${esc(freshWhen(x.at))} 알림</small></b><span class="num">${esc(x.text)}</span></button>`).join('')
      + (list.length > FRESH_ROWS ? `<p class="fresh-more">외 ${list.length - FRESH_ROWS}건</p>` : '');
}
function paintFresh() {
  paintFreshBar();
  if (board) { try { renderBoard(board); } catch (e) { console.error(e); } }   // 테니스장 옆 '새 알림' 표시도 다시 그린다
}
function clearBadge() {                               // 앱을 열면 아이콘 숫자를 지운다
  try { if (navigator.clearAppBadge) Promise.resolve(navigator.clearAppBadge()).catch(() => {}); } catch {}
}
async function clearTray() {                          // 알림 목록에 남은 이 앱의 알림도 치운다(안드로이드는 이것이 아이콘의 숫자·점)
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg && reg.getNotifications) (await reg.getNotifications()).forEach((n) => n.close());
  } catch {}

let inboxBusy = null;
/* opened: 앱을 열었거나 다른 앱에서 돌아옴(true) · 앱을 보고 있는 중에 알림이 옴(false) */
function checkInbox(opened) {
  if (MOCK) return Promise.resolve();
  if (inboxBusy) return inboxBusy;
  inboxBusy = (async () => {
    clearBadge();
    if (opened) clearTray();
    let got = [];
    try {
      const c = await caches.open('tn-inbox'), r = await c.match('/__tn_inbox');
      if (r) { const v = await r.json(); await c.delete('/__tn_inbox'); if (Array.isArray(v)) got = v; }
    } catch {}
    const now = Date.now(), before = JSON.stringify(fresh);
    if (opened) fresh = fresh.filter((x) => now - x.seen < FRESH_KEEP);      // 본 지 10분 넘은 것은 다시 열 때 치운다
    fresh = fresh.filter((x) => now - x.at < FRESH_AGE);
    got.map(freshItem).filter(Boolean).forEach((x) => {
      fresh = fresh.filter((y) => !(y.area === x.area && y.key === x.key));
      fresh.push({...x, seen: now});
      markSeen(x);                                    // 같은 알림이 보낸 알림 기록으로 한 번 더 뜨지 않게
    });
    if (got.length) saveSeen();
    if (JSON.stringify(fresh) !== before) { saveFresh(); paintFresh(); }
  })().finally(() => { inboxBusy = null; });
  return inboxBusy;
}
function goFresh(area) {                              // 새 알림 줄을 누르면 그 테니스장 자리로
  const tag = [...document.querySelectorAll('.newtag')].find((t) => t.dataset.area === area);
  const to = area === PLAY_AREA ? $('play') : tag && (tag.closest('.row, .venue, .opened, .pend') || tag);
  if (!to || to.hidden) return;
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { to.scrollIntoView({block: to.id === 'play' ? 'start' : 'center', behavior: calm ? 'auto' : 'smooth'}); } catch {}
}

/* ── 그리기 ───────────────────────────────────────────── */
const HOT_MS = 2 * 36e5;   // 예약이 열리고 2시간까지는 맨 위에 코트 버튼을 펼쳐 둔다

function spanText(s, e) {                         // 20~22시 · 9:30~10:00

  const [h1, m1] = f(s), [h2, m2] = f(e);

function playRanges(slots) {                      // 이어진 칸은 한 구간으로

  const uniq = all.filter((n) => names.has(n)).concat([...names].filter((n) => !all.includes(n)));
  if (uniq.length > 4) return `코트 ${uniq.length}면`;
  if (uniq.every((n) => /^\d+번$/.test(n))) return `${uniq.map((n) => n.slice(0, -1)).join('·')}번 코트`;

function renderBoard(d) {
  if (d.updated_at) updatedAt = d.updated_at;

  const arr = (v) => (Array.isArray(v) ? v.filter(Boolean) : []);

  const cold = opened.filter((x) => !hot.includes(x));                    // 열린 지 오래됨 → 일정 줄로

      : idleRows
        ? `<p class="sec-sub">${noneText}. 마감된 코트도 눌러서 서울시 예약 화면을 볼 수 있어요.</p><div class="rows">${idleRows}</div>`

  renderPlay(d.play);
  document.querySelectorAll('details[data-key]').forEach((el) => { if (openKeys.has(el.dataset.key)) el.open = true; });   // 펼쳐 둔 목록 유지
  board = d;

}

function paintStamp() {

  const same = updatedAt.slice(0, 10) === todayKST();
  const old = nowMs() - kstMs(updatedAt) > 20 * 60000;
  const text = (same ? `${hm(updatedAt)} 기준` : `${shortDate(updatedAt)} ${hm(updatedAt)} 기준`) + (old ? ' · 오래됨' : '');

function tick() {

  if (!board) return;
  const now = nowMs();
  if (renderedDay !== todayKST()) { renderBoard(board); refreshData(); return; }      // 자정이 지남 → 날짜 문구 다시
  const opening = Boolean(nextOpenMs && now >= nextOpenMs);

let toastTimer = 0;
function toast(msg) {
  if (sheet.open) { say(msg); return; }                // 알림 시트가 열려 있으면 시트 안에 보여 준다(토스트는 시트에 가려짐)

/* ── 서버 호출 · 새로 고침 ────────────────────────────── */
async function api(path, body) {
  if (MOCK) return path === '/board' ? mockBoard(MOCK) : {ok: true, refreshed: false, reason: 'recent', updated_at: mockStamp(), publicKey: ''};
  if (!/^\/(board|refresh|push\/(key|subscribe|unsubscribe|test))$/.test(path)) throw Error('허용되지 않은 요청');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 65000);
  try {
    const r = await fetch(path, {signal: ctrl.signal, ...(body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {})});
    let d = null;
    try { d = await r.json(); } catch {}
    if (!r.ok || !d || d.ok === false) {
      const msg = d && (typeof d.detail === 'string' ? d.detail : typeof d.error === 'string' ? d.error : '');
      const e = msg ? new UserError(msg) : Error('서버 응답 오류');   // 서버가 적어 준 안내만 그대로 보여 준다
      e.status = r.status;
      throw e;
    }
    return d;
  } finally { clearTimeout(timer); }
}

  const id = ++boardReq;

  if (board && takeFeed(board.feed)) paintFresh();   // 화면을 안 보는 사이 받아 둔 보낸 알림 기록
  tick();
  checkPush();
  reconnectPush();
  if (!MOCK && isStale()) refreshData();
});

/* ── 미리보기 데이터(?mock=opened|late|next|soon|none|empty|notice|passed) ── */
function mockStamp() {
  return `${todayKST()} ${new Intl.DateTimeFormat('en-GB', {timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', second: '2-digit'}).format(new Date())}`;
}
function mockBoard(kind) {
  const playKind = kind;

  let seq = 0;
  const c = (court, slot, time, paid = true, confirmed = false) => ({court, slot, time, is_paid: paid, confirmed, reserve_url: `${url}?mock=${++seq}`});
  const hannam = [

    c('3번', '평일 새벽·주간', '06:00-17:00'), c('3번', '평일 야간 · 주말·공휴일', '06:00-22:00'), c('4번', '평일 새벽·주간', '06:00-17:00'), c('4번', '평일 야간 · 일', '12:00-22:00'),
    c('5번', '평일 새벽·주간', '06:00-17:00'), c('5번', '월 야간 · 주말·공휴일', '16:00-22:00'), c('6번', '평일 새벽·주간', '06:00-17:00'), c('6번', '평일 야간 · 주말·공휴일', '06:00-22:00'),
    c('8번', '평일 주간', '12:00-14:00'), c('9번', '평일 주간', '12:00-14:00'), c('10번', '평일 새벽·주간', '06:00-15:00'), c('10번', '월 야간 · 주말·공휴일', '12:00-22:00'),
    c('11번', '평일 새벽·주간', '06:00-17:00'), c('11번', '평일 야간 · 주말·공휴일', '17:00-19:00'), c('12번', '평일 새벽·주간', '06:00-17:00'), c('12번', '평일 야간 · 주말·공휴일', '12:00-19:00'),
  ];
  const jang = [2, 3, 4, 7, 8, 9].flatMap((n) => [c(`${n}번`, '평일 주간', '06:00-18:00'), c(`${n}번`, '평일 야간', '18:00-22:00'), c(`${n}번`, '주말·공휴일', '06:00-22:00')]);
  const forest = {area: '서울숲', place: '서울숲 테니스장', region: '성동구', open_at: day(19, '09:01'), opened: false, period: '2027년 이용분', courts: [c('코트', '주말·공휴일', '06:00-19:00')]};
  const available = kind === 'empty' ? [] : [
    ...(kind === 'late' ? [{area: '장충', place: '장충테니스장', region: '중구', until_label: '11/15까지 이용', until_kind: 'use', period: '11/1~11/15', full_count: 17, courts: [c('3번', '평일 야간', '18:00-22:00')]}] : []),
    {area: '장충', place: '장충테니스장', region: '중구', until_label: '11/30까지 이용', until_kind: 'use', period: '11/16~11/30', full_count: 16, courts: [c('8번', '평일 주간', '06:00-18:00'), c('9번', '평일 주간', '06:00-18:00')]},
    {area: '마루공원', place: '마루공원', region: '강남구', until_label: '상시 예약', until_kind: '', full_count: 0, courts: [c('1면', '매일', '06:00-22:00', false), c('1면 조명', '매일', '06:00-22:00'), c('2면', '매일', '06:00-22:00', false), c('2면 조명', '매일', '06:00-22:00'), c('3면', '매일', '06:00-22:00', false), c('3면 조명', '매일', '06:00-22:00')]},
    {area: '선우공원', place: '선우공원', region: '관악구', until_label: '11/30까지 접수', until_kind: 'rcpt', full_count: 2, courts: [c('B', '평일 주간', '06:00-18:00')]},
    {area: '서울숲', place: '서울숲 테니스장', region: '성동구', until_label: '상시 예약', until_kind: '', full_count: 0, courts: [c('코트', '평일', '06:00-19:00')]},
  ];
  let openings = [];
  if (kind === 'opened') openings = [
    {area: '한남', place: '한남테니스장', region: '용산구', open_at: at(-40), opened: true, period: '11/16~11/30', courts: hannam},
    {area: '장충', place: '장충테니스장', region: '중구', open_at: day(1, '10:00'), opened: false, period: '12/1~12/15', courts: jang}, forest];
  if (kind === 'late') openings = [
    {area: '한남', place: '한남테니스장', region: '용산구', open_at: at(-200), opened: true, period: '11/16~11/30', courts: hannam},
    {area: '장충', place: '장충테니스장', region: '중구', open_at: day(1, '10:00'), opened: false, period: '12/1~12/15', courts: jang}, forest];
  if (kind === 'next') openings = [{area: '장충', place: '장충테니스장', region: '중구', open_at: day(1, '10:00'), opened: false, period: '12/1~12/15', courts: jang}, forest];
  if (kind === 'soon') openings = [{area: '한남', place: '한남테니스장', region: '용산구', open_at: at(42), opened: false, period: '11/16~11/30', courts: hannam}, forest];
  // 시설 공지의 정기 오픈 일정(서울시 자료에 회차가 아직 없음)
  const ex = (area, region, open_at, rule, opened = false) => ({area, place: NAMES[area], region, open_at, opened, period: '', courts: [], expected: true, rule});
  if (kind === 'notice') openings = [ex('한남', '용산구', day(3, '09:00'), '매월 15일·말일 09:00'), ex('장충', '중구', day(13, '10:00'), '매월 10일·25일 10:00'), forest];
  if (kind === 'passed') openings = [ex('한남', '용산구', at(-20), '매월 15일·말일 09:00', true), ex('한남', '용산구', day(15, '09:00'), '매월 15일·말일 09:00'),
    ex('장충', '중구', day(10, '10:00'), '매월 10일·25일 10:00'), forest];
  const busy = new Set(openings.map((x) => x.area));
  const past = {'한남': [day(-12, '09:00')], '장충': [day(-2, '10:00'), day(-18, '10:00')], '선우공원': [day(-16, '09:30'), day(-50, '09:30')]};
  const places = AREAS.map((a) => {
    const nx = openings.find((x) => x.area === a && !x.opened) || {};
    return {area: a, place: NAMES[a], next_open: nx.open_at || '', next_expected: Boolean(nx.expected), open_rule: nx.rule || '',
      past_opens: busy.has(a) ? [] : (past[a] || [])};
  });
  // 접수하지 않는 코트(마감 · 접수 끝남 · 열렸지만 상태 미확인)
  const off = (list, state) => list.map((x) => ({...x, confirmed: false, state, reserve_url: `${url}?mock=${++seq}`}));
  const jangRest = (keep) => off(jang.filter((x) => !keep.includes(`${x.court} ${x.slot}`)), 'full');
  const g = (area, place, region, kindOf, period, label, state, courts, past = false) =>
    ({area, place, region, until_kind: kindOf, period, until_label: label, state, past, courts});
  const closed = kind === 'empty' ? [
    g('한남', '한남테니스장', '용산구', 'use', '10/16~10/31', '10/31까지 이용', 'ended', off(hannam.slice(0, 12), 'ended'), true),
    g('장충', '장충테니스장', '중구', 'use', '11/1~11/15', '11/15까지 이용', 'full', jangRest([])),
    g('장충', '장충테니스장', '중구', 'use', '11/16~11/30', '11/30까지 이용', 'full', jangRest([])),
    g('선우공원', '선우공원', '관악구', 'rcpt', '', '11/30까지 접수', 'full', off([c('A', '평일 주간', '06:00-18:00'), c('B', '평일 주간', '06:00-18:00'), c('B', '주말·공휴일', '06:00-18:00')], 'full')),
    g('서울숲', '서울숲 테니스장', '성동구', '', '', '상시 예약', 'full', off([c('코트', '평일', '06:00-19:00'), c('코트', '주말·공휴일', '06:00-19:00')], 'full')),
  ] : [
    ...(kind === 'opened' || kind === 'late' ? [g('한남', '한남테니스장', '용산구', 'use', '11/16~11/30', '11/30까지 이용', 'unknown', hannam.map((x) => ({...x, state: x.confirmed ? '' : 'unknown'})).filter((x) => x.state))] : []),
    ...(kind === 'soon' ? [] : [g('한남', '한남테니스장', '용산구', 'use', '10/31~11/15', '11/15까지 이용', 'ended', off(hannam.slice(0, 12), 'ended'))]),
    ...(kind === 'late' ? [g('장충', '장충테니스장', '중구', 'use', '11/1~11/15', '11/15까지 이용', 'full', jangRest(['3번 평일 야간']))] : []),
    g('장충', '장충테니스장', '중구', 'use', '11/16~11/30', '11/30까지 이용', 'full', jangRest(['8번 평일 주간', '9번 평일 주간'])),
    g('선우공원', '선우공원', '관악구', 'rcpt', '', '11/30까지 접수', 'full', off([c('A', '평일 주간', '06:00-18:00'), c('B', '주말·공휴일', '06:00-18:00')], 'full')),
    g('서울숲', '서울숲 테니스장', '성동구', '', '', '상시 예약', 'full', off([c('코트', '주말·공휴일', '06:00-19:00')], 'full')),
  ];
  // 보낸 알림 기록 미리보기(?mock=feed · ?mock=playfeed, 반포 것은 &k=1 을 붙이거나 반포 알림을 고른 기기에만 보인다)
  const feed = !/feed$/.test(playKind || '') ? [] : [
    {area: '한남', areas: ['한남'], place: '한남테니스장', kind: 'd1', key: 'open|a', text: '11.14(토) 09:00 예약 오픈', at: Date.now() - 40 * 60000},
    ...(playKind === 'playfeed' ? [
      {area: '반포', areas: ['반포'], place: '반포종합운동장 테니스장', kind: 'd1', key: 'open|b', text: '11.14(토) 09:00 예약 오픈 · 11.21(토) 이용분', at: Date.now() - 20 * 60000},
      {area: '반포', areas: ['반포'], place: '반포종합운동장 테니스장', kind: 'free', key: 'free|c', text: '11.16(월) 14~15시 · 3번 코트', at: Date.now() - 60000}] : [])];
  return {now: mockStamp().slice(0, 16), updated_at: mockStamp(), badge: 0, areas: AREAS, places, openings, available, closed,
    play: mockPlay(playKind, day), feed};
}
function mockPlay(kind, day) {                 // 반포종합운동장(테니스플레이) 빈 시간
  if (!/^play/.test(kind || '')) return null;
  const base = {place: '반포종합운동장 테니스장', url: 'https://www.thetennisplay.com/schedule-booking',
    next_open: {date: day(8, '').trim(), at: day(1, '09:00')}, alerts: {open: true, free: true}, badge: 0};
  if (kind === 'playerr') return {...base, ok: false, state: 'error', days: []};
  const courts = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => `${n}번`);
  const hourNow = new Date(Date.now() + 9 * 36e5).getUTCHours();
  const pick = (i, h) => courts.filter((_, c) => {
    if (kind === 'playfull') return false;
    if (i >= 6) return true;                                             // 먼 날짜는 대부분 비어 있음
    if (i === 2) return false;                                           // 하루는 마감
    const v = (i * 7 + h * 13 + c * 5) % 11;
    return i === 0 ? (h >= 20 && v < 3) : i === 1 ? ((h < 9 || h >= 20) && v < 5) : v < (h < 9 || h >= 21 ? 6 : 2);
  });
  const days = Array.from({length: 8}, (_, i) => ({date: day(i, '').trim(),
    slots: Array.from({length: 16}, (_, k) => 6 + k).filter((h) => i > 0 || h >= hourNow)
      .map((h) => ({s: h, e: h + 1, courts: pick(i, h)})).filter((x) => x.courts.length)}));
  return {...base, ok: true, updated_at: mockStamp(), stale: false, courts, days};
}

/* ── 시작 ─────────────────────────────────────────────── */
function goPlay() {                                   // '반포 빈 시간' 알림을 눌러 들어온 경우 그 구역으로
  const sec = $('play');
  if (sec && !sec.hidden) { try { sec.scrollIntoView({block: 'start'}); } catch {} }
}
if (!MOCK && 'serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && typeof e.data.target === 'string' && /#play$/.test(e.data.target)) { refreshData(); goPlay(); }
    if (e.data && e.data.type === 'inbox' && document.visibilityState === 'visible') checkInbox(false);
  });
}
async function init() {
  renderAreas();
  renderInstall();
  paintPush();
  paintFresh();
  checkInbox(true);                                  // 받은 알림을 읽어 보여 주고 아이콘 숫자를 지운다
  onScroll();
  const slow = setTimeout(() => { const s = $('slow'); if (s) s.hidden = false; }, 6000);
  if (!MOCK) { worker().catch(() => {}); syncPush('auto'); }
  const ok = await loadBoard();
  clearTimeout(slow);
  if (location.hash === '#play') goPlay();
  if (!MOCK && ok === true && isStale()) refreshData();
}
setInterval(() => { if (!MOCK && document.visibilityState === 'visible') refreshData(); }, 180000);
setInterval(tick, 1000);
init();
</script>
