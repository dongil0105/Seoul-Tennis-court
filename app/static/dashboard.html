</style></head><body><main class="app"><header class="header"><div class="brand"><img src="static/icon-192.png" alt="" width="36" height="36"><div><h1>코트 오픈</h1><p>서울 공공 테니스장 5곳</p></div></div><button class="bell" id="bell" aria-label="알림 설정 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="badge" class="badge" hidden></span></button></header><div class="content"><section class="overview" aria-label="5곳 한눈에"><div id="places" class="place-tiles"></div><div class="legend"><span><i></i>지금 예약 가능</span><span><i></i>오늘 열림</span><span><i></i>오픈 예정</span></div></section><section class="section"><div class="section-top"><h2>다음 예약 오픈</h2><button id="refresh" aria-label="공식 데이터 새로 고침">공식 데이터 확인 중 ↻</button></div><p id="refresh-note" role="status" class="note"></p><div id="openings" class="cards" >오픈 일정을 불러오고 있어요.</div><p id="unannounced" class="notice"></p></section><section class="section"><h2>지금 예약 가능</h2><p class="sub">번호를 누르면 그 코트 예약 화면에서 날짜를 고를 수 있어요</p><div id="available" class="available-grid" ></div><p id="board-note" class="note"></p></section><button id="notify-card" class="notify-card"><span class="notify-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span><span><strong id="notification-summary">오픈 알림 받기</strong><small id="notification-detail">원하는 코트가 열리기 전에 알려드려요</small></span><span aria-hidden="true">›</span></button><dialog id="notification" class="notification" aria-labelledby="push-title"><button id="close-sheet" class="close" aria-label="알림 설정 닫기">×</button><p class="eyebrow">기다림은 줄이고, 경기는 더</p><h2 id="push-title" tabindex="-1">오픈 소식, 먼저 받아요</h2><p class="sub">관심 지역과 알림 시간을 골라주세요.</p><div class="areas" id="areas" role="group" aria-label="관심 지역 다중 선택"></div><label class="toggle-row">오픈 전날 알림<input type="checkbox" id="d1" checked role="switch"></label><label class="toggle-row">오픈 1시간 전 알림<input type="checkbox" id="h1" checked role="switch"></label><div id="install" class="install" hidden><strong>홈 화면에서 알림을 켤 수 있어요</strong><ol><li><span class="step-number">01</span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 22V3m-6 6 6-6 6 6M8 14H4v15h24V14h-4"/></svg>Safari 공유 버튼</li><li><span class="step-number">02</span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="6"/><path d="M16 9v14M9 16h14"/></svg>홈 화면에 추가</li><li><span class="step-number">03</span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="2" width="20" height="28" rx="4"/><path d="m12 16 3 3 6-7"/></svg>추가된 앱을 열고<br>알림 켜기</li></ol></div><button id="subscribe" class="action wide">알림 받기 ↗</button><p class="push-status" id="push-status" role="status">원하는 코트가 열리기 전에 알려드릴게요.</p><div class="utility"><button id="test">테스트 알림 보내기</button><button id="unsubscribe" hidden>알림 해제</button></div></dialog><button class="share" id="share">친구에게 공유 ↗</button><p id="share-status" class="note" role="status"></p><p id="toast" role="status"></p><footer>자료: 서울시 공공서비스예약 공식 데이터</footer></div></main><script>'use strict';

$('board-note').textContent=d.note||'';const badge=Math.max(0,Number(d.badge)||0);$('badge').hidden=!badge;$('badge').textContent='';$('bell').setAttribute('aria-label','알림 설정 열기, 새 소식 '+badge+'건');try{if(navigator.setAppBadge)Promise.resolve(navigator.setAppBadge(badge)).catch(()=>{})}catch{}updateNotification();}

async function loadBoard(){const id=++boardRequest;try{const d=await api('/board');if(id!==boardRequest)return 'ignored';if(updatedAt&&d.updated_at&&d.updated_at<updatedAt)return 'ignored';renderBoard(d);return true}catch{if(id===boardRequest)$('refresh-note').textContent='데이터를 받지 못했어요. 새로고침으로 다시 시도해주세요.';return false}}
function refreshData(){if(refreshPromise)return refreshPromise;++boardRequest;$('refresh').disabled=true;$('refresh').setAttribute('aria-busy','true');refreshPromise=(async()=>{try{let result;try{result=await api('/refresh',{})}catch{result={reason:'error'}}const loaded=await loadBoard();$('refresh-note').textContent=loaded==='ignored'?'최신 화면을 유지했어요.':!loaded?'데이터를 받지 못했어요. 다시 시도해주세요.':['error','empty'].includes(result.reason)?'최신 수집이 지연되어 마지막 공식 데이터를 표시해요.':result.reason==='recent'?'90초 안에 갱신한 공식 데이터예요.':'';return result}finally{$('refresh').disabled=false;$('refresh').setAttribute('aria-busy','false');refreshPromise=null}})();return refreshPromise}
function isStale(){const t=Date.parse(updatedAt.replace(' ','T')+'+09:00');return !Number.isFinite(t)||Date.now()-t>180000}
$('refresh').onclick=refreshData;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isStale())refreshData()});
function renderAreas(){$('areas').innerHTML=AREAS.map(a=>`<button class="area" aria-pressed="${settings.areas.includes(a)}">${esc(a)}</button>`).join('');$('areas').querySelectorAll('button').forEach(b=>b.onclick=()=>{settings.areas=settings.areas.includes(b.textContent)?settings.areas.filter(a=>a!==b.textContent):[...settings.areas,b.textContent];save();renderAreas();$('push-status').textContent='설정을 적용하려면 알림 받기를 눌러주세요.'})}
function b64Bytes(s){const normalized=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(normalized+'='.repeat((4-normalized.length%4)%4)),c=>c.charCodeAt(0))}
function equalBytes(a,b){if(!a)return false;const x=new Uint8Array(a),y=new Uint8Array(b);return x.length===y.length&&x.every((v,i)=>v===y[i])}
function worker(){if(!('serviceWorker' in navigator))return Promise.reject(Error('이 브라우저는 앱 알림을 지원하지 않아요.'));if(!swPromise)swPromise=navigator.serviceWorker.register('/sw.js').then(async r=>{await navigator.serviceWorker.ready;return r}).catch(e=>{swPromise=null;throw e});return swPromise}
const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),standalone=Boolean(navigator.standalone)||matchMedia('(display-mode: standalone)').matches;
$('install').hidden=!(isiOS&&!standalone);$('subscribe').hidden=isiOS&&!standalone;
function pushUI(){updateNotification(); $('unsubscribe').hidden=!subscription;$('subscribe').textContent=subscription?'알림 설정 저장 ↗':'알림 받기 ↗'}
async function syncPush(automatic=false){if(pushBusy)return;pushBusy=true;$('subscribe').disabled=true;try{if(MOCK){if(automatic)return;$('push-status').textContent='미리보기예요. 실제 알림은 서버에서 켤 수 있어요.';return}if(isiOS&&!standalone)return;if(!('Notification' in window)||!('PushManager' in window))throw Error('이 브라우저는 알림을 지원하지 않아요. 최신 Safari 또는 Chrome을 이용해주세요.');if(automatic&&Notification.permission!=='granted')return;if(!automatic&&!settings.areas.length)throw Error('관심 지역을 하나 이상 골라주세요.');if(!automatic){const permission=await Notification.requestPermission();if(permission!=='granted')throw Error(permission==='denied'?'브라우저 설정에서 이 사이트의 알림을 허용해주세요.':'알림 권한을 허용해야 소식을 받을 수 있어요.')}const reg=await worker();subscription=await reg.pushManager.getSubscription();if(automatic&&!subscription)return;const {publicKey}=await api('/push/key'),key=b64Bytes(publicKey);if(subscription&&!equalBytes(subscription.options.applicationServerKey,key)){const old=subscription;await old.unsubscribe();subscription=null;try{await api('/push/unsubscribe',{endpoint:old.endpoint})}catch{}}if(!subscription)subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});await api('/push/subscribe',{subscription:subscription.toJSON(),areas:settings.areas,d1:settings.d1,h1:settings.h1});settings.enabled=true;save();$('push-status').textContent='알림이 켜졌어요. 선택한 지역의 오픈 소식을 알려드릴게요.'}catch(e){$('push-status').textContent=(e.message&& !/fetch|network|abort/i.test(e.message))?e.message:'알림 연결이 어려워요. 알림 받기를 눌러 다시 시도해주세요.'}finally{pushBusy=false;$('subscribe').disabled=false;pushUI()}}
$('subscribe').onclick=()=>syncPush();$('unsubscribe').onclick=async()=>{if(pushBusy)return;pushBusy=true;try{if(!subscription)throw Error('켜진 알림이 없어요.');const old=subscription;await api('/push/unsubscribe',{endpoint:old.endpoint});await old.unsubscribe();subscription=null;settings.enabled=false;save();$('push-status').textContent='알림을 껐어요. 언제든 다시 켤 수 있어요.'}catch{$('push-status').textContent='알림 해제가 안 됐어요. 다시 시도해주세요.'}finally{pushBusy=false;pushUI()}};
$('test').onclick=async()=>{if(MOCK){$('push-status').textContent='미리보기에서는 실제 알림을 보내지 않아요.';return}if(!subscription){$('push-status').textContent='먼저 알림 받기를 눌러주세요.';return}$('test').disabled=true;try{await api('/push/test',{endpoint:subscription.endpoint});$('push-status').textContent='테스트 알림을 보냈어요. 기기 알림을 확인해주세요.'}catch{$('push-status').textContent='테스트 알림을 보내지 못했어요. 다시 시도해주세요.'}finally{$('test').disabled=false}};
$('d1').checked=settings.d1;$('h1').checked=settings.h1;['d1','h1'].forEach(id=>$(id).onchange=()=>{settings[id]=$(id).checked;save();$('push-status').textContent='설정을 적용하려면 알림 받기를 눌러주세요.'});renderAreas();

$('share').onclick=async()=>{const u=new URL(location.href);u.searchParams.delete('mock');try{if(navigator.share)await navigator.share({title:'코트 오픈',text:'서울 공공 테니스장, 예약 오픈을 놓치지 마세요.',url:u.href});else{await navigator.clipboard.writeText(u.href);$('share-status').textContent='링크를 복사했어요.'}}catch(e){if(e.name!=='AbortError')$('share-status').textContent='링크 복사가 안 됐어요. 주소창의 링크를 복사해주세요.'}};
